name: Apply V67 Kernel Variable Import Relocation

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-kernel-variable-import-v67.py'
      - 'test-kernel-variable-import-relocation.mjs'
      - '.github/workflows/apply-kernel-variable-import-v67.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-kernel-variable-import-v67
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate V67 updater and regression
        run: |
          python3 -m py_compile tools/apply-kernel-variable-import-v67.py
          node --check test-kernel-variable-import-relocation.mjs

      - name: Apply V67 Xenia kernel-variable relocation
        run: python3 tools/apply-kernel-variable-import-v67.py

      - name: Verify V67 source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "67"
          grep -q 'PatchFinalizedXexGuestU32BE' src/xenia_web_bootstrap/xex_guest_mapper.cpp
          grep -q 'r360_xex_guest_mapper_patch_u32_be' src/xenia_web_bootstrap/xex_guest_mapper.cpp
          grep -q 'r360_xex_guest_mapper_patch_u32_be' link-xenia-ppc-bootstrap.sh
          grep -q 'XexExecutableModuleHandle' render360-title-controller.mjs
          grep -q 'kernelVariableRegistration' render360-title-controller.mjs
          grep -q 'const RENDER360_RELEASE=67;' runtime/render360-runtime.js
          grep -q 'const CONTENT_BRIDGE={release:67,' runtime/render360-runtime.js
          grep -q 'Render360 67' index.html
          grep -q '<span>UI Release</span><span class="value">67</span>' index.html
          grep -q "const VERSION='67';" render360-sw.js

      - name: Commit V67 runtime and loader parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Render360 V67 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/xenia_web_bootstrap/xex_guest_mapper.cpp \
            src/xenia_web_bootstrap/xex_guest_mapper.h \
            link-xenia-ppc-bootstrap.sh \
            render360-title-controller.mjs \
            VERSION runtime/render360-runtime.js index.html render360-sw.js
          if git diff --cached --quiet; then
            echo 'V67 source/release already current.'
          else
            git commit -m 'fix: relocate Xenia kernel variable imports'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build, verify and publish V67 browser bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run xenia-browser-bootstrap-fastlane.yml --ref main
          sleep 5
          run_id="$(gh run list --workflow xenia-browser-bootstrap-fastlane.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "V67 bootstrap run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify XexExecutableModuleHandle through published bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node ./test-kernel-variable-import-relocation.mjs ./xenia_ppc_bootstrap.wasm

      - name: Rebuild release-67 package core
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync-package-core.yml --ref main
          sleep 4
          run_id="$(gh run list --workflow sync-package-core.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "Package-core run: $run_id"
          gh run watch "$run_id" --exit-status
