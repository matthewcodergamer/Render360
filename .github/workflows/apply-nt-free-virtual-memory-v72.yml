name: Apply V72 NtFreeVirtualMemory

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-nt-free-virtual-memory-v72.py'
      - '.github/workflows/apply-nt-free-virtual-memory-v72.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-nt-free-virtual-memory-v72
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate V72 updater and regression
        run: |
          python3 -m py_compile tools/apply-nt-free-virtual-memory-v72.py
          node --check test-kernel-nt-free-virtual-memory.mjs

      - name: Apply V72 NtFreeVirtualMemory service
        run: python3 tools/apply-nt-free-virtual-memory-v72.py

      - name: Verify V72 source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "72"
          grep -q 'case 0x00DC:  // NtFreeVirtualMemory' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'kXMemDecommit = 0x00004000u' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'kXMemRelease = 0x00008000u' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'kXStatusMemoryNotAllocated = 0xC00000A0u' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'NtFreeVirtualMemory(uint32_t base_addr_ptr' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'test-kernel-nt-free-virtual-memory.mjs' .github/workflows/xenia-browser-bootstrap-fastlane.yml
          grep -q 'Verify NtFreeVirtualMemory kernel service' .github/workflows/xenia-browser-bootstrap-fastlane.yml
          grep -q 'const RENDER360_RELEASE=72;' runtime/render360-runtime.js
          grep -q 'const CONTENT_BRIDGE={release:72,' runtime/render360-runtime.js
          grep -q 'Render360 72' index.html
          grep -q '<span>UI Release</span><span class="value">72</span>' index.html
          grep -q "const VERSION='72';" render360-sw.js

      - name: Commit V72 kernel free-memory service and release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Render360 V72 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/xenia_web_bootstrap/kernel_runtime_foundation.cpp \
            .github/workflows/xenia-browser-bootstrap-fastlane.yml \
            VERSION runtime/render360-runtime.js index.html render360-sw.js
          if git diff --cached --quiet; then
            echo 'V72 source/release already current.'
          else
            git commit -m 'fix: implement NtFreeVirtualMemory service'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build, verify and publish V72 browser bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run xenia-browser-bootstrap-fastlane.yml --ref main
          sleep 5
          run_id="$(gh run list --workflow xenia-browser-bootstrap-fastlane.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "V72 bootstrap run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify published V72 provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:VERSION)" = "72"
          meta="$(git show origin/main:xenia_ppc_bootstrap.meta.json)"
          echo "$meta"
          echo "$meta" | grep -q 'sourceCommit'
          echo "$meta" | grep -q 'sourceRun'
          echo "$meta" | grep -q 'sha256'

      - name: Rebuild release-72 package core
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync-package-core.yml --ref main
          sleep 4
          run_id="$(gh run list --workflow sync-package-core.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "Package-core run: $run_id"
          gh run watch "$run_id" --exit-status

# retry after correcting the V72 regression fixture syntax
