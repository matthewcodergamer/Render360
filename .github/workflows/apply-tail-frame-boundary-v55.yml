name: Apply Tail Frame Boundary V55

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-tail-frame-boundary-v55.py'
      - '.github/workflows/apply-tail-frame-boundary-v55.yml'

permissions:
  contents: write

concurrency:
  group: apply-tail-frame-boundary-v55
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7

      - name: Normalize tail-frame patcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-tail-frame-boundary-v55.py')
          s = p.read_text()

          old_anchor = "s=one(s,'#include \"sparse_guest_memory.h\"\\n','#include \"sparse_guest_memory.h\"\\n#include \"xex_pe_guest_loader.h\"\\n','backend loader include')"
          new_anchor = "s=one(s,'#include \"kernel_import_probe.h\"\\n','#include \"kernel_import_probe.h\"\\n#include \"xex_pe_guest_loader.h\"\\n','backend loader include')"
          if old_anchor in s:
              s = s.replace(old_anchor, new_anchor, 1)
          elif new_anchor not in s:
              raise SystemExit('tail patcher backend include anchor not recognized')

          old_len = 'insn=((data>>30)&1u)?4u:2u'
          new_len = 'insn=4u'
          if old_len in s:
              s = s.replace(old_len, new_len, 1)
          elif new_len not in s:
              raise SystemExit('tail patcher .pdata FunctionLength expression not recognized')

          old_fastlane = """s=r('.github/workflows/xenia-browser-bootstrap-fastlane.yml')
s=one(s,\"      - 'prepare-hir-stack-history-overlay.py'\\n\",\"      - 'prepare-hir-stack-history-overlay.py'\\n      - 'prepare-hir-tail-frame-overlay.py'\\n\",'fastlane path')
w('.github/workflows/xenia-browser-bootstrap-fastlane.yml',s)
"""
          new_fastlane = """s=r('.github/workflows/xenia-browser-bootstrap-fastlane.yml')
if \"      - 'prepare-hir-tail-frame-overlay.py'\\n\" not in s: raise SystemExit('fastlane tail-frame path missing')
"""
          if old_fastlane in s:
              s = s.replace(old_fastlane, new_fastlane, 1)
          elif new_fastlane not in s:
              raise SystemExit('tail patcher fastlane mutation block not recognized')

          p.write_text(s)
          print('TAIL_FRAME_PATCHER_PREFLIGHT=PASS')
          PY

      - name: Apply tail-frame boundary fix
        shell: bash
        run: |
          rm -f tail-frame-apply-error.txt
          set +e
          python3 tools/apply-tail-frame-boundary-v55.py > tail-frame-apply-error.txt 2>&1
          code=$?
          cat tail-frame-apply-error.txt
          if [ "$code" -ne 0 ]; then
            git config user.name 'Render360 Tail Frame Fix Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add tools/apply-tail-frame-boundary-v55.py tail-frame-apply-error.txt
            git commit -m 'ci: capture tail-frame patch failure' || true
            git push origin HEAD:main || true
            exit "$code"
          fi

      - name: Verify patch contracts
        shell: bash
        run: |
          python3 -m py_compile tools/apply-tail-frame-boundary-v55.py prepare-hir-tail-frame-overlay.py
          node ./test-braid-frame-history.mjs
          grep -q 'PreparedPeGuestFindRuntimeFunction' src/xenia_web_bootstrap/xex_pe_guest_loader.cpp
          grep -q 'SetHIRCorrectnessExecutionEntry' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'CurrentLogicalGuestDepth' prepare-hir-tail-frame-overlay.py
          grep -q 'prepare-hir-tail-frame-overlay.py' build-xenia-ppc-bootstrap.sh
          grep -q "prepare-hir-tail-frame-overlay.py" .github/workflows/xenia-browser-bootstrap-fastlane.yml
          ! grep -q 'insn=((data>>30)&1u)?4u:2u' tools/apply-tail-frame-boundary-v55.py
          grep -q 'insn=4u' tools/apply-tail-frame-boundary-v55.py
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'Render360 Tail Frame Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f tail-frame-apply-error.txt
          git add -A
          if git diff --cached --quiet; then
            echo 'Tail-frame boundary fix already applied.'
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing bot commit that mutates workflow files.' >&2
            git diff --cached --name-only >&2
            exit 3
          fi
          git commit -m 'fix: preserve Xbox tail-frame function boundaries'
          git push origin HEAD:main
