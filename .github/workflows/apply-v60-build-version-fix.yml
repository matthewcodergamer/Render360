name: Apply V60 Build and Version Fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v60-build-version-fix.py'
      - '.github/workflows/apply-v60-build-version-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-v60-build-version-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply V60 build and version repair
        run: python3 tools/apply-v60-build-version-fix.py

      - name: Verify V60 contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "60"
          grep -q 'const RENDER360_RELEASE=60;' runtime/render360-runtime.js
          grep -q 'const CONTENT_BRIDGE={release:60,' runtime/render360-runtime.js
          grep -q 'Render360 60' index.html
          grep -q '<span>UI Release</span><span class="value">60</span>' index.html
          grep -q "const VERSION='60';" render360-sw.js
          grep -q 'R360_V60_STORE_CONTEXT_STACK_COMPAT' prepare-hir-call-return-stack-overlay.py
          grep -q 'store_case_anchor' prepare-hir-call-return-stack-overlay.py
          grep -q 'R360_STACK_WRITE ppc=' prepare-hir-call-return-stack-overlay.py

      - name: Commit repaired source and release 60
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Render360 V60 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            prepare-hir-call-return-stack-overlay.py \
            VERSION \
            runtime/render360-runtime.js \
            index.html \
            render360-sw.js
          if git diff --cached --quiet; then
            echo 'changed=0' >> "$GITHUB_OUTPUT"
            echo 'V60 build/version repair already applied.'
            exit 0
          fi
          git commit -m 'fix: make V60 build overlay compatible and align website release'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=1' >> "$GITHUB_OUTPUT"

      - name: Start fresh V60 bootstrap build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run xenia-browser-bootstrap-fastlane.yml --ref main
