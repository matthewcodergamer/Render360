name: Apply WebGPU Browser Runtime

on:
  push:
    branches: [main]
    paths:
      - '.r360-patches/webgpu-runtime.part*'
      - '.github/workflows/apply-webgpu-browser-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .r360-patches/webgpu-runtime.part1 \
            .r360-patches/webgpu-runtime.part2 \
            .r360-patches/webgpu-runtime.part3 \
            .r360-patches/webgpu-runtime.part4 \
            .r360-patches/webgpu-runtime.part5 \
            .r360-patches/webgpu-runtime.part6 \
            .r360-patches/webgpu-runtime.part7 \
            .r360-patches/webgpu-runtime.part8 \
            .r360-patches/webgpu-runtime.part9 \
            | base64 -d > /tmp/webgpu.patch.gz
          echo 'd19b4fab93916374b98d67acfea723505399fa8070041e2bce08760daa56d448  /tmp/webgpu.patch.gz' | sha256sum -c -
          gzip -dc /tmp/webgpu.patch.gz > /tmp/webgpu.patch
          git apply --check /tmp/webgpu.patch
          git apply /tmp/webgpu.patch

      - name: Parse and static checks
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            render360-webgpu-runtime.mjs \
            render360-webgpu-xenos.mjs \
            render360-title-frontbuffer.mjs \
            render360-browser-modern-content-bridge.mjs \
            render360-browser-modern-iso-bridge.mjs \
            render360-streaming-source.mjs \
            render360-web-worker-pool.mjs \
            render360-browser-features.mjs \
            storage/game-storage.js \
            test-webgpu-browser-runtime.mjs; do
            node --check "$file"
          done
          python -m py_compile serve.py
          rm -rf __pycache__
          python -c "from pathlib import Path; p=Path('render360-title-frontbuffer.mjs'); p.write_text(p.read_text().rstrip()+'\\n')"

      - name: Browser runtime critics
        shell: bash
        run: |
          set -euo pipefail
          node test-webgpu-browser-runtime.mjs
          node test-webgpu-wgsl-edram-foundation.mjs
          node test-browser-features-contract.mjs
          node test-webgl2-xenos-fallback.mjs

      - name: Commit runtime implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name render360-ci
          git config user.email render360-ci@users.noreply.github.com
          git add \
            README.md \
            WEBGPU_BROWSER_RUNTIME.md \
            render360-browser-features.mjs \
            render360-browser-modern-content-bridge.mjs \
            render360-browser-modern-iso-bridge.mjs \
            render360-streaming-source.mjs \
            render360-title-frontbuffer.mjs \
            render360-web-worker-pool.mjs \
            render360-webgpu-runtime.mjs \
            render360-webgpu-xenos.mjs \
            serve.py \
            storage/game-storage.js \
            test-webgpu-browser-runtime.mjs
          git diff --cached --check
          git commit -m 'feat: add WebGPU Xenos browser runtime foundation'
          git push origin HEAD:main
