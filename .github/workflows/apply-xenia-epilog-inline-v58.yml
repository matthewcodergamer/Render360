name: Apply Xenia Epilog Inline V58

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-xenia-epilog-inline-v58.py'
      - '.github/workflows/apply-xenia-epilog-inline-v58.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-xenia-epilog-inline-v58
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply V58 epilog helper bridge
        run: python3 tools/apply-xenia-epilog-inline-v58.py

      - name: Verify V58 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R360_EPILOG_HELPER executed' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'ExecuteSharedEpilogReturn' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'MatchSharedEpilogReturnSignature' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'epilog_by_signature' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'uint8_t lr_raw\[4\]' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'context->lr = ReadBigEndian32(lr_raw)' src/xenia_web_bootstrap/probe_backend.cpp
          if grep -q 'uint8_t lr_raw\[8\]' src/xenia_web_bootstrap/probe_backend.cpp; then
            echo 'V58 contract violation: shared epilog LR restore is still 64-bit.' >&2
            exit 1
          fi

      - name: Commit V58 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Render360 V58 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/xenia_web_bootstrap/probe_backend.cpp
          if git diff --cached --quiet; then
            echo 'V58 source already applied.'
            exit 0
          fi
          git commit -m 'fix: execute Braid shared epilog on live PPC context'
          git pull --rebase origin main
          git push origin HEAD:main
