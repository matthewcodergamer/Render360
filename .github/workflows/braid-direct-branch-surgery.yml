name: Braid Direct Branch Surgery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/braid-direct-branch-surgery.yml'

permissions:
  contents: write

jobs:
  surgery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install runtime surgery
        run: python3 tools/braid-direct-branch-surgery.py
      - name: Validate patch
        run: |
          git diff --check
          node --check test-direct-call-sparse-window.mjs
          grep -q 'DecodeDirectBranchTarget' src/xenia_web_bootstrap/hir_correctness_executor.cpp
          grep -q 'DIRECT_CALL_BRANCH_FORMS=PASS' test-direct-call-sparse-window.mjs
      - name: Commit runtime surgery
        run: |
          git config user.name 'render360-ci'
          git config user.email 'render360-ci@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix: execute Xenia direct tail and conditional branches'
          git push origin HEAD:main
