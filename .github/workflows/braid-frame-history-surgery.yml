name: Braid Frame History Surgery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/braid-frame-history-surgery.yml'
      - 'tools/braid-frame-history-surgery.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: braid-frame-history-surgery
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair embedded overlay literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/braid-frame-history-surgery.py')
          s=p.read_text()
          s=s.replace("p.write_text(r'''#!/usr/bin/env python3\n", 'p.write_text(r"""#!/usr/bin/env python3\n', 1)
          s=s.replace("print('HIR_STACK_HISTORY_OVERLAY=PASS')\n''')\n\n\n# 3)", "print('HIR_STACK_HISTORY_OVERLAY=PASS')\n\"\"\")\n\n\n# 3)", 1)
          p.write_text(s)
          PY
          python3 -m py_compile tools/braid-frame-history-surgery.py

      - name: Apply ordered Braid stack/call history plumbing
        shell: bash
        run: |
          set -o pipefail
          python3 tools/braid-frame-history-surgery.py 2>&1 | tee braid-frame-history-surgery.log

      - name: Validate surgery
        shell: bash
        run: |
          set -o pipefail
          {
            set -eux
            python3 -m py_compile tools/braid-frame-history-surgery.py prepare-hir-stack-history-overlay.py
            node --check render360-title-controller.mjs
            node --check developer-console.js
            node --check test-braid-frame-history.mjs
            node test-braid-frame-history.mjs
            node test-braid-r1-boundary-diagnostics.mjs
            node test-ui-contract.mjs
            git diff --check
          } 2>&1 | tee braid-frame-history-validation.log

      - name: Commit verified surgery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/braid-frame-history-surgery.py \
            build-xenia-ppc-bootstrap.sh \
            prepare-hir-stack-history-overlay.py \
            .github/workflows/xenia-browser-bootstrap-fastlane.yml \
            render360-title-controller.mjs \
            developer-console.js \
            test-braid-frame-history.mjs
          git diff --cached --check
          git commit -m 'diag: trace Braid stack frame history' || exit 0
          git push origin HEAD:main

      - name: Upload surgery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braid-frame-history-surgery-log
          path: |
            braid-frame-history-surgery.log
            braid-frame-history-validation.log
          if-no-files-found: warn
          retention-days: 2
