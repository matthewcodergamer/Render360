name: Braid main-stack geometry repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/braid-main-stack-geometry-fix.yml'
      - 'tools/braid-main-stack-geometry-fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded-stack repair
        run: python3 tools/braid-main-stack-geometry-fix.py

      - name: Validate patched browser and regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check developer-console.js
          node --check render360-title-controller.mjs
          node --check test-braid-startup-critic.mjs
          node --check test-opcode39-main-thread.mjs
          node --check test-guest-runtime-critic.mjs
          node test-ui-contract.mjs
          node test-braid-startup-critic.mjs ./xenia_ppc_bootstrap.wasm
          node test-opcode39-main-thread.mjs ./xenia_ppc_bootstrap.wasm
          git diff --check

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add developer-console.js render360-title-controller.mjs src/xenia_web_bootstrap/kernel_runtime_foundation.cpp test-braid-startup-critic.mjs test-opcode39-main-thread.mjs test-guest-runtime-critic.mjs test-ui-contract.mjs
          git diff --cached --check
          git commit -m 'fix: align browser stacks with Xenia guards' || exit 0
          git push origin HEAD:main
