name: Braid Portal Runtime Followup Gate

on:
  workflow_run:
    workflows: ['Xenia WASM32 Bootstrap']
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  runtime-followup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact Xenia bootstrap artifact
        uses: actions/download-artifact@v4
        with:
          name: xenia-wasm32-bootstrap-report
          path: .runtime-followup-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify Portal scan extent and assembler telemetry
        run: |
          set -euo pipefail
          WASM="$(find .runtime-followup-artifact -type f -name xenia_ppc_bootstrap.wasm | head -n 1)"
          test -n "$WASM"
          node ./test-ppc-scan-diagnostics.mjs "$WASM"
      - name: Verify Braid-class sparse misses fail closed
        run: |
          set -euo pipefail
          WASM="$(find .runtime-followup-artifact -type f -name xenia_ppc_bootstrap.wasm | head -n 1)"
          test -n "$WASM"
          node ./test-hir-sparse-fail-closed.mjs "$WASM"
      - name: Verify nested HIR blocker propagation
        run: |
          set -euo pipefail
          WASM="$(find .runtime-followup-artifact -type f -name xenia_ppc_bootstrap.wasm | head -n 1)"
          test -n "$WASM"
          node ./test-kernel-abi-critic.mjs "$WASM"
