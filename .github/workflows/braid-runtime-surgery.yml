name: Braid Runtime Surgery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/braid-runtime-surgery.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: braid-runtime-surgery
  cancel-in-progress: false

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Braid CPU/runtime surgery
        run: python3 tools/braid-runtime-surgery.py

      - name: Commit surgery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/braid-runtime-surgery.yml tools/braid-runtime-surgery.py
          git diff --check
          git config user.name 'Render360 Surgery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/xenia_web_bootstrap/hir_correctness_executor.cpp \
                  render360-iso-title-controller.mjs \
                  test-direct-call-sparse-window.mjs \
                  test-braid-startup-critic.mjs \
                  .github/workflows/braid-startup-gate.yml \
                  .github/workflows/braid-runtime-surgery.yml \
                  tools/braid-runtime-surgery.py
          git commit -m 'fix: resolve Braid tail-call startup path'
          git push origin HEAD:main

      - name: Dispatch fresh bootstrap build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run xenia-browser-bootstrap-fastlane.yml --ref main
