name: Braid Startup Integration Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/braid-startup-gate.yml'
      - 'test-braid-startup-critic.mjs'
      - 'test-opcode39-main-thread.mjs'
      - 'xenia_ppc_bootstrap.wasm'
      - 'xenia_ppc_bootstrap.meta.json'
      - 'render360-title-controller.mjs'
      - 'render360-browser-title-runtime.mjs'
      - 'app.js'
      - 'ui-behavior.js'
      - 'runtime/render360-runtime.js'
  workflow_dispatch:

jobs:
  published-startup-critic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published opcode39 main-thread path
        run: node ./test-opcode39-main-thread.mjs ./xenia_ppc_bootstrap.wasm
      - name: Verify published Braid startup integration
        run: node ./test-braid-startup-critic.mjs ./xenia_ppc_bootstrap.wasm
      - name: Verify canonical browser runtime chain
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="app.js"' index.html
          grep -q 'src="ui-behavior.js"' index.html
          grep -q "from '../wasm-core.js'" runtime/render360-runtime.js
          grep -q "from '../runtime-host.js'" runtime/render360-runtime.js
          grep -q "from './runtime-worker.js'" runtime-host.js
          grep -q "from './wasm-core.js'" runtime-worker.js
          grep -q 'xenia_ppc_bootstrap.wasm' render360-browser-title-runtime.mjs
          echo 'R360_BROWSER_RUNTIME_CHAIN=PASS'
