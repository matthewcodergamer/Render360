name: Fix Symbol-less Direct Call

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-direct-call-hotfix.py'
      - '.github/workflows/fix-symbol-less-direct-call.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hotfix
        run: python3 tools/apply-direct-call-hotfix.py
      - name: Verify JavaScript contracts
        run: |
          node --check app-v42-patch.js
          node --check render360-xenios-ui.mjs
          node --check test-title-kernel-import-integration.mjs
          node test-xenios-ui-contract.mjs
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-symbol-less-direct-call.yml tools/apply-direct-call-hotfix.py
          git add src/xenia_web_bootstrap/hir_correctness_executor.cpp test-title-kernel-import-integration.mjs render360-xenios-ui.mjs app-v42-patch.js test-xenios-ui-contract.mjs
          git commit -m "fix: keep direct-call fallback symbol-less"
          git push origin HEAD:main
      - name: Dispatch bootstrap build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run xenia-wasm32-bootstrap.yml --ref main
