name: Package Render360 XeniOS V46

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-render360-v46.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v4
      - name: Build source ZIP
        run: |
          git archive --format=zip --output=Render360-XeniOS-v46.zip HEAD
          zip -d Render360-XeniOS-v46.zip '.github/workflows/package-render360-v46.yml' || true
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: render360-xenios-v46-source
          path: Render360-XeniOS-v46.zip
          if-no-files-found: error
          retention-days: 2
