name: Verify and Package WebGPU Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-webgpu-runtime.yml'

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            render360-webgpu-runtime.mjs \
            render360-webgpu-xenos.mjs \
            render360-title-frontbuffer.mjs \
            render360-browser-modern-content-bridge.mjs \
            render360-browser-modern-iso-bridge.mjs \
            render360-streaming-source.mjs \
            render360-web-worker-pool.mjs \
            render360-browser-features.mjs \
            storage/game-storage.js \
            test-webgpu-browser-runtime.mjs; do
            node --check "$file"
          done
          python -m py_compile serve.py
          rm -rf __pycache__

      - name: Browser runtime critics
        shell: bash
        run: |
          set -euo pipefail
          node test-webgpu-browser-runtime.mjs
          node test-webgpu-wgsl-edram-foundation.mjs
          node test-browser-features-contract.mjs
          node test-webgl2-xenos-fallback.mjs

      - name: Package exact repository
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$(git rev-parse HEAD)" > IMPLEMENTATION_COMMIT.txt
          zip -qr /tmp/Render360-WebGPU-runtime.zip . \
            -x '.git/*' \
               '.github/workflows/package-webgpu-runtime.yml'
          unzip -t /tmp/Render360-WebGPU-runtime.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Render360-WebGPU-runtime
          path: /tmp/Render360-WebGPU-runtime.zip
          if-no-files-found: error
          compression-level: 0
