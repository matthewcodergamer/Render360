name: Publish Browser Bootstrap

on:
  workflow_run:
    workflows: ['Xenia WASM32 Bootstrap']
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refuse stale runtime artifacts
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          # Browser/UI-only commits made while the long build runs are fine.
          # Any change to the actual Xenia/WASM runtime closure means this
          # artifact is stale and must never overwrite a later verified build.
          if ! git diff --quiet "$SOURCE_SHA"..HEAD -- \
            build-xenia-ppc-bootstrap.sh \
            link-xenia-ppc-bootstrap.sh \
            'prepare-*-overlay.py' \
            src/xenia_web_bootstrap \
            src/xenia_web_shims \
            xenia_port \
            render360_xenia_core.cpp \
            render360_xenia_core_v32.cpp \
            build-core.sh; then
            echo "Refusing stale bootstrap: runtime source changed after $SOURCE_SHA"
            exit 78
          fi
      - name: Download verified bootstrap artifact
        uses: actions/download-artifact@v4
        with:
          name: xenia-wasm32-bootstrap-report
          path: verified-bootstrap
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish bootstrap binary and provenance
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          src='verified-bootstrap/build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm'
          test -s "$src"
          cp "$src" xenia_ppc_bootstrap.wasm
          sha="$(sha256sum xenia_ppc_bootstrap.wasm | awk '{print $1}')"
          bytes="$(wc -c < xenia_ppc_bootstrap.wasm | tr -d ' ')"
          printf '{\n  "sourceCommit": "%s",\n  "sourceRun": "%s",\n  "sha256": "%s",\n  "bytes": %s\n}\n' "$SOURCE_SHA" "$SOURCE_RUN" "$sha" "$bytes" > xenia_ppc_bootstrap.meta.json
          git config user.name 'render360-ci'
          git config user.email 'render360-ci@users.noreply.github.com'
          git add xenia_ppc_bootstrap.wasm xenia_ppc_bootstrap.meta.json
          if git diff --cached --quiet; then
            echo 'Browser bootstrap already matches verified artifact.'
            exit 0
          fi
          git commit -m 'build: publish verified Xenia browser bootstrap'
          git push origin HEAD:main
