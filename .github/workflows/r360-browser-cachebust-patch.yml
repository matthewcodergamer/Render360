name: Render360 Browser Integration Cache Bust Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r360-browser-cachebust-patch.yml'

permissions:
  contents: write

jobs:
  patch-browser-entrypoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire browser feature bridge into fresh entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          replacements = {
              'manifest.webmanifest?v=44.2': 'manifest.webmanifest?v=44.11',
              'app-v41.js?v=44.10': 'app-v41.js?v=44.11',
              'app-v42-patch.js?v=44.10': 'app-v42-patch.js?v=44.11',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'missing index entrypoint: {old}')
              text = text.replace(old, new)
          index.write_text(text)

          app = Path('app-v41.js')
          text = app.read_text()
          old = "from './settings/app-settings-store.js?v=44';"
          new = "from './settings/app-settings-store.js?v=44.11';"
          if old not in text and new not in text:
              raise SystemExit('missing app settings import')
          app.write_text(text.replace(old, new))

          patch = Path('app-v42-patch.js')
          text = patch.read_text()
          feature_import = "import './render360-browser-features.mjs?v=44.11';"
          if feature_import not in text:
              marker = "import './developer-console-v44.js?v=44.5';"
              if marker not in text:
                  raise SystemExit('missing V44 patch import marker')
              text = text.replace(marker, marker + '\n' + feature_import, 1)
          patch.write_text(text)
          PY
      - name: Commit entrypoint update
        run: |
          if git diff --quiet -- index.html app-v41.js app-v42-patch.js; then
            echo 'Entrypoints already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v41.js app-v42-patch.js
          git commit -m 'feat: load Safari capability bridge from fresh app entrypoints'
          git push
