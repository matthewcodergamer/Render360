name: Render360 guest runtime diagnostic

on:
  push:
    paths:
      - '.github/workflows/r360-guest-runtime-diagnostic.yml'
  workflow_dispatch:

jobs:
  guest-runtime-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Locate guest runtime stall
        run: |
          set -o pipefail
          timeout --signal=TERM 45s node ./test-guest-runtime-hang-locator.mjs ./xenia_ppc_bootstrap.wasm 2>&1 | tee guest-runtime.log
      - name: Show diagnostic log
        if: always()
        run: cat guest-runtime.log || true
