name: Render360 Icon Entrypoint Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r360-icon-entrypoint-patch.yml'

permissions:
  contents: write

jobs:
  patch-icon-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Render360 icon into website head
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          text = text.replace('manifest.webmanifest?v=44.11', 'manifest.webmanifest?v=44.12')
          marker = '  <title>Render360 · Xbox 360 Emulator</title>\n'
          links = (
              '  <link rel="icon" href="render360-app-icon.svg?v=44.12" type="image/svg+xml">\n'
              '  <link rel="mask-icon" href="render360-app-icon.svg?v=44.12" color="#30D158">\n'
          )
          if links not in text:
              if marker not in text:
                  raise SystemExit('Render360 title marker missing')
              text = text.replace(marker, marker + links, 1)
          p.write_text(text)
          PY
      - name: Commit icon entrypoint update
        run: |
          if git diff --quiet -- index.html; then
            echo 'Icon entrypoint already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'design: use new Render360 icon across web entrypoint'
          git push
