name: Render360 title memory overlay critic

on:
  workflow_dispatch:
  push:
    paths:
      - 'prepare-title-runtime-memory-overlay.py'
      - 'src/xenia_web_bootstrap/hir_correctness_executor.cpp'
      - 'src/xenia_web_bootstrap/sparse_guest_memory.cpp'
      - 'src/xenia_web_bootstrap/title_gpu_runtime.cpp'

permissions:
  contents: read

jobs:
  verify-title-memory-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authoritative sparse RAM and Xenos MMIO overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile prepare-title-runtime-memory-overlay.py
          python3 - <<'PY'
          from pathlib import Path

          base = Path('src/xenia_web_bootstrap/hir_correctness_executor.cpp').read_text()
          overlay = Path('prepare-title-runtime-memory-overlay.py').read_text()
          sparse = Path('src/xenia_web_bootstrap/sparse_guest_memory.cpp').read_text()

          required_base = [
              'ReadSparseGuestMemory',
              'WriteSparseGuestMemory',
              'ReadTitleGpuMmio',
              'WriteTitleGpuMmio',
              'R360_HIR_MEMORY_FAIL op=load',
          ]
          required_overlay = [
              'ReadSparseGuestMemory',
              'WriteSparseGuestMemory',
              'ReadTitleGpuMmio',
              'WriteTitleGpuMmio',
          ]
          required_sparse = [
              'kFaultUnmapped = 1',
              'ReadSparseGuestMemory',
              'WriteSparseGuestMemory',
          ]

          for label, text, needles in [
              ('base executor', base, required_base),
              ('production overlay', overlay, required_overlay),
              ('sparse memory', sparse, required_sparse),
          ]:
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f'{label}: missing {missing}')

          print('TITLE_RUNTIME_SPARSE_RAM=PASS')
          print('TITLE_RUNTIME_XENOS_MMIO=PASS')
          print('TITLE_MEMORY_OVERLAY_CRITIC=PASS')
          PY
