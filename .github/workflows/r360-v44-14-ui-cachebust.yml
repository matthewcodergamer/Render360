name: Render360 V44.14 UI Cache Bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r360-v44-14-ui-cachebust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump XeniOS UI module and page entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app-v42-patch.js')
          s=app.read_text()
          old="import './render360-xenios-ui.mjs?v=44.13';"
          new="import './render360-xenios-ui.mjs?v=44.14';"
          if old not in s and new not in s:
            raise SystemExit('XeniOS module import not found')
          app.write_text(s.replace(old,new,1))

          index=Path('index.html')
          s=index.read_text()
          old='app-v42-patch.js?v=44.13'
          new='app-v42-patch.js?v=44.14'
          if old not in s and new not in s:
            raise SystemExit('app-v42 page entrypoint not found')
          index.write_text(s.replace(old,new,1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/r360-v44-14-ui-cachebust.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v42-patch.js index.html
          git commit -m 'design: activate XeniOS V44.14 reference pass'
          git push origin HEAD:main
