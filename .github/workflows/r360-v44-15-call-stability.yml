name: Render360 V44.15 CALL Stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r360-v44-15-call-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsafe persistent Module pointer while retaining resolver provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/xenia_web_bootstrap/probe_backend.cpp')
          s=p.read_text()
          replacements=[
            ('ProbeBackend* g_probe_backend = nullptr;\nxe::cpu::Module* g_active_probe_module = nullptr;\nbool g_execute_correctness_on_assemble = true;',
             'ProbeBackend* g_probe_backend = nullptr;\nbool g_execute_correctness_on_assemble = true;'),
            ('bool ResolveNestedGuestAddress(uint32_t address) { return TranslateNestedGuestAddress(address, g_active_probe_module); }',
             'bool ResolveNestedGuestAddress(uint32_t address) { return TranslateNestedGuestAddress(address, nullptr); }'),
            ('  const bool nested_execution = IsHIRCorrectnessExecutionActive();\n  if (!nested_execution && function) g_active_probe_module = function->module();\n  const bool execute_correctness =',
             '  const bool nested_execution = IsHIRCorrectnessExecutionActive();\n  const bool execute_correctness ='),
            ('R360_CALL_RESOLVERS_READY call=1 address=1 active_module=1',
             'R360_CALL_RESOLVERS_READY call=1 address=1 stable=1'),
          ]
          for old,new in replacements:
            if old not in s: raise SystemExit(f'missing source marker: {old[:70]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit stable resolver source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/xenia_web_bootstrap/probe_backend.cpp
          git commit -m 'fix: keep nested CALL resolver module lifetime safe'
          git push origin HEAD:main
