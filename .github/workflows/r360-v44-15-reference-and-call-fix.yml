name: Render360 V44.15 Reference + CALL Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r360-v44-15-reference-and-call-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V44.15 UI, truthful FPS, and nested CALL fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch marker: {label}')
              return text.replace(old, new, 1)

          # ---- XeniOS/iOS presentation layer ----
          p=Path('render360-xenios-ui.mjs')
          text=p.read_text()
          a=text.index('const ICONS={')
          b=text.index('\n};',a)+3
          text=text[:a]+'''const ICONS={
            // A web page cannot call UIKit UIImage(systemName:). On Apple devices,
            // ask the native system font stack to render these standard glyphs
            // instead of shipping hand-drawn lookalike SVG artwork.
            settings:`<span class="r360-native-ios-symbol r360-native-gear" aria-hidden="true">⚙︎</span>`,
            plus:`<span class="r360-native-ios-symbol r360-native-plus" aria-hidden="true">＋</span>`
          };'''+text[b:]

          a=text.index('function addStyle(){')
          b=text.index('\nfunction installSystemIcons',a)
          text=text[:a]+'''function addStyle(){
            const sheets=[
              ['base','./ui-v44-xenios.css?v=44.14'],
              ['reference','./ui-v44-xenios-v15.css?v=44.15'],
            ];
            for(const [key,href] of sheets){
              if(document.querySelector(`link[data-r360-xenios-ui="${key}"]`))continue;
              const link=document.createElement('link');link.rel='stylesheet';link.href=href;link.dataset.r360XeniosUi=key;document.head.appendChild(link);
            }
          }
          '''+text[b:]

          a=text.index('function onTelemetry(t={}){')
          b=text.index('\nasync function detectGpuLabel',a)
          text=text[:a]+'''function onTelemetry(t={}){
            const guestPresented=Boolean(t.realFrame)||Number(t.swaps||0)>0;
            const fps=guestPresented?Number(t.fps||0):0;
            if(fps>0){
              minFps=Math.min(minFps,fps);maxFps=Math.max(maxFps,fps);
              if($('hudFpsRange'))$('hudFpsRange').textContent=`${minFps.toFixed(1)} / ${maxFps.toFixed(1)}`;
            }else if(!guestPresented&&$('hudFpsRange')){
              $('hudFpsRange').textContent='— / —';
            }
            if($('hudResolution'))$('hudResolution').textContent=resolutionFromTelemetry(t);
            if($('hudPipeline'))$('hudPipeline').textContent=`${Number(t.pm4Packets||0).toLocaleString()} PM4`;
          }
          '''+text[b:]
          text=text.replace('Render360 V44.14','Render360 V44.15')
          write(p,text)

          # ---- Live HUD semantics: never report host/UI cadence as guest game FPS ----
          p=Path('app-v41.js')
          text=p.read_text()
          text=must_replace(
            text,
            "setText('hudFps',t.fps?t.fps.toFixed(1):'—');",
            "const guestPresented=Boolean(t.realFrame)||Number(t.swaps||0)>0;const guestFps=guestPresented?Number(t.fps||0):0;setText('hudFps',guestPresented&&guestFps>0?guestFps.toFixed(1):'—');",
            'hud guest fps')
          text=must_replace(
            text,
            "setText('hudFrame',t.frameMs?`${t.frameMs.toFixed(1)} ms`:'—');",
            "setText('hudFrame',guestPresented&&t.frameMs?`${t.frameMs.toFixed(1)} ms`:'—');",
            'hud frame ms')
          text=must_replace(
            text,
            "setText('hudBackend',t.realFrame?'REAL FRAME':String(t.shaderStatus||'waiting').toUpperCase());",
            "setText('hudBackend',guestPresented?(t.realFrame?'REAL FRAME':'PRESENTING'):'CPU ONLY');",
            'hud backend truth')
          text=must_replace(text,"hudHistory.push(t.fps||0);","hudHistory.push(guestFps);",'hud history')
          write(p,text)

          # ---- Cache/version wiring ----
          p=Path('app-v42-patch.js'); text=p.read_text()
          text=re.sub(r"render360-xenios-ui\.mjs\?v=44\.\d+",'render360-xenios-ui.mjs?v=44.15',text,count=1)
          write(p,text)

          p=Path('index.html'); text=p.read_text()
          text=re.sub(r'app-v41\.js\?v=44\.\d+','app-v41.js?v=44.15',text,count=1)
          text=re.sub(r'app-v42-patch\.js\?v=44\.\d+','app-v42-patch.js?v=44.15',text,count=1)
          write(p,text)

          # ---- UI contract now verifies the measured correction layer ----
          p=Path('test-xenios-ui-contract.mjs')
          p.write_text('''import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const patch=readFileSync('app-v42-patch.js','utf8');
          const ui=readFileSync('render360-xenios-ui.mjs','utf8');
          const css=readFileSync('ui-v44-xenios.css','utf8');
          const ref=readFileSync('ui-v44-xenios-v15.css','utf8');
          const app=readFileSync('app-v41.js','utf8');
          assert.ok(patch.includes("import './render360-xenios-ui.mjs?v=44.15';"),'V44.15 UI module is not loaded by the live app');
          for(const token of ['installSystemIcons','installLibraryChrome','centerNavigation','installPerformanceHud','installStickGuides','render360:telemetry','navigator.gpu.requestAdapter','estimateRefreshRate','hudGpuName','hudResolution','hudFpsRange','ui-v44-xenios-v15.css?v=44.15','⚙︎','＋'])assert.ok(ui.includes(token),`missing UI integration token: ${token}`);
          for(const token of ['.r360-brand','.r360-centered-nav','.performance-hud','.x-hud-table','.r360-stick-guide','@media(orientation:landscape)','#libraryView:not(.has-games) .search-wrap','.ios-icon-button'])assert.ok(css.includes(token),`missing base UI styling contract: ${token}`);
          for(const token of ['#developerToggle.developer-toggle','width:148px!important','height:110px!important','--x15-move:#1e1b1e','--x15-pause:#33281b','.r360-native-ios-symbol'])assert.ok(ref.includes(token),`missing reference correction token: ${token}`);
          for(const id of ['hudFps','hudFrame','hudCpu','hudGpu','hudScale','hudRam','hudPm4','hudDraws','hudBackend']){assert.ok(ui.includes(`id="${id}"`),`compact HUD must preserve telemetry ID ${id}`);assert.ok(app.includes(`'${id}'`),`app telemetry writer missing ${id}`);}
          assert.ok(app.includes('guestPresented'),'guest FPS must be presentation-gated');
          assert.ok(app.includes("'CPU ONLY'"),'pre-frame HUD state must be explicit');
          console.log('R360_XENIOS_IOS_UI_CONTRACT=PASS');
          ''')

          # Include the new reference stylesheet in the critic's trigger closure.
          p=Path('.github/workflows/r360-xenios-ui.yml'); text=p.read_text()
          if "      - 'ui-v44-xenios-v15.css'" not in text:
              text=text.replace("      - 'ui-v44-xenios.css'", "      - 'ui-v44-xenios.css'\n      - 'ui-v44-xenios-v15.css'")
          write(p,text)

          # ---- Native HIR direct CALL fix/provenance ----
          # The source already has recursive guest-call resolution. Keep the active
          # title Module for address-decoded calls too, and emit an unmistakable
          # resolver-ready marker so browser logs prove the rebuilt WASM contains it.
          p=Path('src/xenia_web_bootstrap/probe_backend.cpp'); text=p.read_text()
          text=must_replace(text,
            'ProbeBackend* g_probe_backend = nullptr;\nbool g_execute_correctness_on_assemble = true;',
            'ProbeBackend* g_probe_backend = nullptr;\nxe::cpu::Module* g_active_probe_module = nullptr;\nbool g_execute_correctness_on_assemble = true;',
            'active probe module')
          text=must_replace(text,
            'bool ResolveNestedGuestAddress(uint32_t address) { return TranslateNestedGuestAddress(address, nullptr); }',
            'bool ResolveNestedGuestAddress(uint32_t address) { return TranslateNestedGuestAddress(address, g_active_probe_module); }',
            'address resolver module')
          text=must_replace(text,
            '  const bool nested_execution = IsHIRCorrectnessExecutionActive();\n  const bool execute_correctness =',
            '  const bool nested_execution = IsHIRCorrectnessExecutionActive();\n  if (!nested_execution && function) g_active_probe_module = function->module();\n  const bool execute_correctness =',
            'capture root module')
          text=must_replace(text,
            '  g_probe_backend = this; SetHIRCorrectnessCallResolver(&ResolveNestedGuestCall); SetHIRCorrectnessAddressResolver(&ResolveNestedGuestAddress);',
            '  g_probe_backend = this; SetHIRCorrectnessCallResolver(&ResolveNestedGuestCall); SetHIRCorrectnessAddressResolver(&ResolveNestedGuestAddress);\n  std::fprintf(stderr, "R360_CALL_RESOLVERS_READY call=1 address=1 active_module=1\\n");',
            'resolver ready marker')
          write(p,text)
          PY

      - name: Parse and run UI contract before commit
        run: |
          node --check render360-xenios-ui.mjs
          node --check app-v42-patch.js
          node test-xenios-ui-contract.mjs

      - name: Commit V44.15 corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render360-xenios-ui.mjs ui-v44-xenios-v15.css app-v41.js app-v42-patch.js index.html test-xenios-ui-contract.mjs .github/workflows/r360-xenios-ui.yml src/xenia_web_bootstrap/probe_backend.cpp
          if git diff --cached --quiet; then
            echo 'V44.15 corrections already applied.'
            exit 0
          fi
          git commit -m 'fix: match XeniOS controls and advance native guest CALLs'
          git push origin HEAD:main
