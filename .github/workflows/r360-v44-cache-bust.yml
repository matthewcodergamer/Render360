name: Render360 V44 Safari cache bust

on:
  push:
    paths:
      - '.github/workflows/r360-v44-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-cache-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force fresh runtime modules on iOS Safari
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'index.html': [
              ('app-v41.js?v=44.4','app-v41.js?v=44.5'),
              ('app-v42-patch.js?v=44.4','app-v42-patch.js?v=44.5'),
            ],
            'app-v41.js': [
              ('./runtime/render360-runtime.js?v=44.4','./runtime/render360-runtime.js?v=44.5'),
            ],
            'app-v42-patch.js': [
              ("./developer-console-v44.js?v=44'","./developer-console-v44.js?v=44.5'"),
            ],
            'runtime/render360-runtime.js': [
              ("../runtime-host-v32.js'","../runtime-host-v32.js?v=44.5'"),
              ('../render360-browser-modern-content-bridge.mjs?v=44.4','../render360-browser-modern-content-bridge.mjs?v=44.5'),
            ],
            'render360-browser-modern-content-bridge.mjs': [
              ('./render360-browser-title-runtime.mjs?v=44.4','./render360-browser-title-runtime.mjs?v=44.5'),
            ],
            'render360-browser-title-runtime.mjs': [
              ('./xenia_ppc_bootstrap.wasm?v=44.2','./xenia_ppc_bootstrap.wasm?v=44.5'),
            ],
          }
          for name, pairs in replacements.items():
            p=Path(name); s=p.read_text(); original=s
            for old,new in pairs:
              if old in s: s=s.replace(old,new)
              elif new not in s: raise SystemExit(f'{name}: missing cache marker {old!r}')
            if s!=original: p.write_text(s)
          print('R360_V44_SAFARI_CACHE_BUST=44.5')
          PY
          git diff --check
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v41.js app-v42-patch.js runtime/render360-runtime.js render360-browser-modern-content-bridge.mjs render360-browser-title-runtime.mjs
          git diff --cached --check
          git commit -m 'fix: force fresh V44.5 runtime on Safari' || exit 0
          git push origin HEAD:main
