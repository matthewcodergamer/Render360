name: Render360 V44 Exact HIR Blocker Telemetry

on:
  push:
    paths:
      - '.github/workflows/r360-v44-hir-blocker-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instrument exact commercial HIR blocker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Preserve the first exact HIR failure in ExecuteBuilder.
          p = Path('src/xenia_web_bootstrap/hir_correctness_executor.cpp')
          s = p.read_text()
          old = '''  RuntimeValues values;\n  bool supported = true;\n  bool reached_return = false;\n  auto* block = builder->first_block();'''
          new = '''  RuntimeValues values;\n  bool supported = true;\n  bool reached_return = false;\n  uint32_t current_source_address = 0;\n  auto* block = builder->first_block();'''
          if old not in s:
            raise SystemExit('ExecuteBuilder state marker not found')
          s = s.replace(old, new, 1)

          old = '''      if (++result.instructions_executed > kMaxCorrectnessInstructions ||\n          !instr->opcode) {\n        supported = false;\n        break;\n      }\n\n      switch (instr->opcode->num) {\n        case xe::cpu::hir::OPCODE_SOURCE_OFFSET:\n        case xe::cpu::hir::OPCODE_CONTEXT_BARRIER:\n        case xe::cpu::hir::OPCODE_MEMORY_BARRIER:\n          break;'''
          new = '''      if (++result.instructions_executed > kMaxCorrectnessInstructions) {\n        result.blocker_kind = kHIRBlockerInstructionLimit;\n        result.blocker_address = current_source_address;\n        supported = false;\n        break;\n      }\n      if (!instr->opcode) {\n        result.blocker_kind = kHIRBlockerUnsupportedOpcode;\n        result.blocker_address = current_source_address;\n        supported = false;\n        break;\n      }\n\n      switch (instr->opcode->num) {\n        case xe::cpu::hir::OPCODE_SOURCE_OFFSET:\n          current_source_address = static_cast<uint32_t>(instr->src1.offset);\n          break;\n        case xe::cpu::hir::OPCODE_CONTEXT_BARRIER:\n        case xe::cpu::hir::OPCODE_MEMORY_BARRIER:\n          break;'''
          if old not in s:
            raise SystemExit('ExecuteBuilder instruction marker not found')
          s = s.replace(old, new, 1)

          old = '''        default:\n          supported = false;\n          break;\n      }\n      if (block_terminated) break;'''
          new = '''        default:\n          supported = false;\n          break;\n      }\n      if (!supported && result.blocker_kind == kHIRBlockerNone) {\n        const uint32_t opcode = instr->opcode ? instr->opcode->num : 0;\n        const bool call_boundary =\n            opcode == xe::cpu::hir::OPCODE_CALL ||\n            opcode == xe::cpu::hir::OPCODE_CALL_TRUE ||\n            opcode == xe::cpu::hir::OPCODE_CALL_INDIRECT ||\n            opcode == xe::cpu::hir::OPCODE_CALL_INDIRECT_TRUE;\n        result.blocker_kind = call_boundary ? kHIRBlockerUnresolvedCall\n                                            : kHIRBlockerUnsupportedOpcode;\n        result.blocker_opcode = opcode;\n        result.blocker_address = current_source_address;\n      }\n      if (block_terminated) break;'''
          if old not in s:
            raise SystemExit('ExecuteBuilder default marker not found')
          s = s.replace(old, new, 1)

          old = '''  result.supported = supported;\n  result.reached_return_boundary = reached_return;\n  result.r3 = context.r[3];\n  return result;'''
          new = '''  result.supported = supported;\n  result.reached_return_boundary = reached_return;\n  result.r3 = context.r[3];\n  if (supported && !reached_return && result.blocker_kind == kHIRBlockerNone) {\n    result.blocker_kind = kHIRBlockerNoReturnBoundary;\n    result.blocker_address = current_source_address;\n  }\n  return result;'''
          if old not in s:
            raise SystemExit('ExecuteBuilder result marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Carry the blocker through the bootstrap telemetry ABI.
          p = Path('src/xenia_web_bootstrap/probe_backend.h')
          s = p.read_text()
          old = '''  uint32_t correctness_instructions = 0;\n  uint64_t correctness_r3 = 0;\n};'''
          new = '''  uint32_t correctness_instructions = 0;\n  uint64_t correctness_r3 = 0;\n  uint32_t correctness_blocker_kind = 0;\n  uint32_t correctness_blocker_opcode = 0;\n  uint32_t correctness_blocker_address = 0;\n};'''
          if old not in s:
            raise SystemExit('ProbeTelemetry marker not found')
          s = s.replace(old, new, 1)
          old = '''uint64_t r360_ppc_probe_correctness_r3();\n}'''
          new = '''uint64_t r360_ppc_probe_correctness_r3();\nuint32_t r360_ppc_probe_correctness_blocker_kind();\nuint32_t r360_ppc_probe_correctness_blocker_opcode();\nuint32_t r360_ppc_probe_correctness_blocker_address();\n}'''
          if old not in s:
            raise SystemExit('probe export declaration marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/xenia_web_bootstrap/probe_backend.cpp')
          s = p.read_text()
          old = '''    g_probe_telemetry.correctness_status =\n        !execute_correctness ? 4u\n                             : (!correctness.supported\n                                    ? 1u\n                                    : (!correctness.reached_return_boundary ? 2u\n                                                                           : 3u));\n  }'''
          new = '''    g_probe_telemetry.correctness_status =\n        !execute_correctness ? 4u\n                             : (!correctness.supported\n                                    ? 1u\n                                    : (!correctness.reached_return_boundary ? 2u\n                                                                           : 3u));\n    g_probe_telemetry.correctness_blocker_kind = correctness.blocker_kind;\n    g_probe_telemetry.correctness_blocker_opcode = correctness.blocker_opcode;\n    g_probe_telemetry.correctness_blocker_address = correctness.blocker_address;\n  }'''
          if old not in s:
            raise SystemExit('correctness telemetry assignment marker not found')
          s = s.replace(old, new, 1)
          old = '''uint64_t r360_ppc_probe_correctness_r3(){return render360::xenia_web::GetProbeTelemetry().correctness_r3;}\nR360_WASM_EXPORT("r360_ppc_probe_set_execute_on_translate")'''
          new = '''uint64_t r360_ppc_probe_correctness_r3(){return render360::xenia_web::GetProbeTelemetry().correctness_r3;}\nuint32_t r360_ppc_probe_correctness_blocker_kind(){return render360::xenia_web::GetProbeTelemetry().correctness_blocker_kind;}\nuint32_t r360_ppc_probe_correctness_blocker_opcode(){return render360::xenia_web::GetProbeTelemetry().correctness_blocker_opcode;}\nuint32_t r360_ppc_probe_correctness_blocker_address(){return render360::xenia_web::GetProbeTelemetry().correctness_blocker_address;}\nR360_WASM_EXPORT("r360_ppc_probe_set_execute_on_translate")'''
          if old not in s:
            raise SystemExit('correctness export marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Surface exact native telemetry through title-controller JS.
          p = Path('render360-title-controller.mjs')
          s = p.read_text()
          old = '''  const execStatusFn=maybe(bootstrap,'r360_ppc_probe_correctness_status');\n  const execInstructionsFn=maybe(bootstrap,'r360_ppc_probe_correctness_instructions');\n  const execR3Fn=maybe(bootstrap,'r360_ppc_probe_correctness_r3');'''
          new = '''  const execStatusFn=maybe(bootstrap,'r360_ppc_probe_correctness_status');\n  const execInstructionsFn=maybe(bootstrap,'r360_ppc_probe_correctness_instructions');\n  const execR3Fn=maybe(bootstrap,'r360_ppc_probe_correctness_r3');\n  const execBlockerKindFn=maybe(bootstrap,'r360_ppc_probe_correctness_blocker_kind');\n  const execBlockerOpcodeFn=maybe(bootstrap,'r360_ppc_probe_correctness_blocker_opcode');\n  const execBlockerAddressFn=maybe(bootstrap,'r360_ppc_probe_correctness_blocker_address');'''
          if old not in s:
            raise SystemExit('title controller telemetry function marker not found')
          s = s.replace(old, new, 1)
          old = '''  const executionStatus=execStatusFn?(execStatusFn()>>>0):0;\n  const executionInstructions=execInstructionsFn?(execInstructionsFn()>>>0):0;\n  const executionR3Hex=execR3Fn?`0x${BigInt.asUintN(64,execR3Fn()).toString(16)}`:'0x0';'''
          new = '''  const executionStatus=execStatusFn?(execStatusFn()>>>0):0;\n  const executionInstructions=execInstructionsFn?(execInstructionsFn()>>>0):0;\n  const executionR3Hex=execR3Fn?`0x${BigInt.asUintN(64,execR3Fn()).toString(16)}`:'0x0';\n  const executionBlockerKind=execBlockerKindFn?(execBlockerKindFn()>>>0):0;\n  const executionBlockerOpcode=execBlockerOpcodeFn?(execBlockerOpcodeFn()>>>0):0;\n  const executionBlockerAddress=execBlockerAddressFn?(execBlockerAddressFn()>>>0):0;'''
          if old not in s:
            raise SystemExit('title controller execution values marker not found')
          s = s.replace(old, new, 1)
          old = '''  const runtimeBoundary=executionStatus===3?'guest-return':kernelLastStatus===2?'kernel-import-unimplemented':kernelLastStatus===3?'kernel-import-abi-failed':executionStatus===2?'no-return-boundary':executionStatus===1?'unsupported-hir-or-runtime-dependency':'execution-not-observed';'''
          new = '''  const runtimeBoundary=executionStatus===3?'guest-return':kernelLastStatus===2?'kernel-import-unimplemented':kernelLastStatus===3?'kernel-import-abi-failed':executionStatus===2?'no-return-boundary':executionStatus===1?(executionBlockerKind===2?'unresolved-guest-call':executionBlockerKind===3?'instruction-limit':'unsupported-hir-or-runtime-dependency'):'execution-not-observed';'''
          if old not in s:
            raise SystemExit('runtimeBoundary marker not found')
          s = s.replace(old, new, 1)
          old = '''return {headerSize,preparedBytes:prepared.length,peStagingCapacity:peStage.capacity,peStagingGrew:peStage.stagingGrew,entry,hir,handoffBytes:pick(bootstrap,'r360_title_handoff_bytes')()>>>0,status:pick(bootstrap,'r360_title_handoff_status')()>>>0,entryExecutionMode,startupGprCount,executionStatus,executionInstructions,executionR3Hex,translatedFunctionCount,'''
          new = '''return {headerSize,preparedBytes:prepared.length,peStagingCapacity:peStage.capacity,peStagingGrew:peStage.stagingGrew,entry,hir,handoffBytes:pick(bootstrap,'r360_title_handoff_bytes')()>>>0,status:pick(bootstrap,'r360_title_handoff_status')()>>>0,entryExecutionMode,startupGprCount,executionStatus,executionInstructions,executionR3Hex,executionBlockerKind,executionBlockerOpcode,executionBlockerAddress,translatedFunctionCount,'''
          if old not in s:
            raise SystemExit('title controller return marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 4) Make the browser blocker itself exact, while staying compatible
          # with the currently-published binary until the rebuilt bootstrap lands.
          p = Path('render360-browser-modern-content-bridge.mjs')
          s = p.read_text()
          s = s.replace('?v=44.3\';', '?v=44.4\';')
          old = '''  result.compatibilityExecution={used:true,reason:'generated-wasm-entry-not-callable',entry:result.entry>>>0,executionStatus:status,executionInstructions:result.executionInstructions>>>0,runtimeBoundary:result.runtimeBoundary,reachedKernelBlocker:result.reachedKernelBlocker??null};\n  stage(onStage,'execute',`Native HIR compatibility execution · ${Number(result.executionInstructions||0).toLocaleString()} instructions · ${result.runtimeBoundary}`);'''
          new = '''  const exact=result.executionBlockerOpcode?` · opcode ${result.executionBlockerOpcode} @ 0x${(result.executionBlockerAddress>>>0).toString(16).toUpperCase()}`:'';\n  result.compatibilityExecution={used:true,reason:'generated-wasm-entry-not-callable',entry:result.entry>>>0,executionStatus:status,executionInstructions:result.executionInstructions>>>0,runtimeBoundary:result.runtimeBoundary,blockerKind:result.executionBlockerKind>>>0,blockerOpcode:result.executionBlockerOpcode>>>0,blockerAddress:result.executionBlockerAddress>>>0,reachedKernelBlocker:result.reachedKernelBlocker??null};\n  stage(onStage,'execute',`Native HIR compatibility execution · ${Number(result.executionInstructions||0).toLocaleString()} instructions · ${result.runtimeBoundary}${exact}`);'''
          if old not in s:
            raise SystemExit('compatibility execution marker not found')
          s = s.replace(old, new, 1)
          old = '''    const compatibilityBlocker=state.result.reachedKernelBlocker??(status===1?{kind:'native-hir-unsupported-boundary',entry:state.result.entry>>>0,message:`Native HIR compatibility execution reached ${state.result.runtimeBoundary}`}:(status===2?{kind:'native-hir-no-return-boundary',entry:state.result.entry>>>0,message:`Native HIR compatibility execution reached ${state.result.runtimeBoundary}`}:null));'''
          new = '''    const exact=state.result.executionBlockerOpcode?` · HIR opcode ${state.result.executionBlockerOpcode} @ 0x${(state.result.executionBlockerAddress>>>0).toString(16).toUpperCase()}`:'';\n    const compatibilityBlocker=state.result.reachedKernelBlocker??(status===1?{kind:state.result.runtimeBoundary==='unresolved-guest-call'?'native-hir-unresolved-call':'native-hir-unsupported-boundary',entry:state.result.entry>>>0,hirBlockerKind:state.result.executionBlockerKind>>>0,hirOpcode:state.result.executionBlockerOpcode>>>0,guestAddress:state.result.executionBlockerAddress>>>0,message:`Native HIR compatibility execution reached ${state.result.runtimeBoundary}${exact}`}:(status===2?{kind:'native-hir-no-return-boundary',entry:state.result.entry>>>0,message:`Native HIR compatibility execution reached ${state.result.runtimeBoundary}${exact}`}:null));'''
          if old not in s:
            raise SystemExit('compatibility blocker marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Cache-bust top-level module chain so iOS Safari cannot reuse V44.3.
          p = Path('runtime/render360-runtime.js')
          s = p.read_text().replace('render360-browser-modern-content-bridge.mjs?v=44.3','render360-browser-modern-content-bridge.mjs?v=44.4')
          p.write_text(s)
          p = Path('app-v41.js')
          s = p.read_text().replace('runtime/render360-runtime.js?v=44.3','runtime/render360-runtime.js?v=44.4')
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text().replace('app-v41.js?v=44.3','app-v41.js?v=44.4').replace('app-v42-patch.js?v=44.3','app-v42-patch.js?v=44.4')
          p.write_text(s)
          PY

      - name: Validate exact blocker patch
        shell: bash
        run: |
          node --check render360-title-controller.mjs
          node --check render360-browser-modern-content-bridge.mjs
          node --check runtime/render360-runtime.js
          node --check app-v41.js
          grep -q 'correctness_blocker_opcode' src/xenia_web_bootstrap/probe_backend.h
          grep -q 'kHIRBlockerUnresolvedCall' src/xenia_web_bootstrap/hir_correctness_executor.cpp
          grep -q 'executionBlockerOpcode' render360-title-controller.mjs
          grep -q 'HIR opcode' render360-browser-modern-content-bridge.mjs

      - name: Commit exact HIR blocker telemetry
        shell: bash
        run: |
          git config user.name 'Render360 HIR Telemetry'
          git config user.email 'actions@users.noreply.github.com'
          git add src/xenia_web_bootstrap/hir_correctness_executor.cpp src/xenia_web_bootstrap/probe_backend.h src/xenia_web_bootstrap/probe_backend.cpp render360-title-controller.mjs render360-browser-modern-content-bridge.mjs runtime/render360-runtime.js app-v41.js index.html
          git commit -m 'CPU: expose exact commercial HIR blocker'
          git push
