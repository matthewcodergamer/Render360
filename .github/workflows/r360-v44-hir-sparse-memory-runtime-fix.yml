name: Render360 V44 opcode39 runtime gate

on:
  push:
    paths:
      - '.github/workflows/r360-v44-hir-sparse-memory-runtime-fix.yml'
      - 'tools/r360_opcode39_authoritative_memory_fix.py'
      - 'test-opcode39-main-thread.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production title memory path
        run: |
          python3 tools/r360_opcode39_authoritative_memory_fix.py
          python3 -m py_compile tools/r360_opcode39_authoritative_memory_fix.py prepare-title-runtime-memory-overlay.py
          node --check render360-title-controller.mjs
          node --check render360-browser-modern-content-bridge.mjs
          node --check render360-browser-title-runtime.mjs
          node --check runtime/render360-runtime.js
          node --check app-v41.js
          git diff --check

      - name: Build and link browser bootstrap
        run: |
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 bash -lc '
            set -o pipefail
            bash ./fetch-xenia.sh
            set +e
            bash ./build-xenia-ppc-bootstrap.sh
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              report=build/xenia-ppc-bootstrap/report.tsv
              cat build/xenia-ppc-bootstrap/render360_hir_correctness_executor.cpp.o.log || true
              if ! grep -q $'"'"'^render360/hir_correctness_executor.cpp\tPASS\t'"'"' "$report"; then
                exit "$status"
              fi
              unexpected=$(awk -F $'"'"'\t'"'"' '"'"'$2=="BLOCKED" && $1!="src/xenia/cpu/compiler/passes/data_flow_analysis_pass.cc" && $1!="src/xenia/cpu/compiler/passes/value_reduction_pass.cc" {print $1}'"'"' "$report")
              if [ -n "$unexpected" ]; then
                echo "Unexpected wasm32 blockers:"
                echo "$unexpected"
                exit "$status"
              fi
              echo R360_COMPILE_MATRIX=PASS_WITH_2_KNOWN_HOST_ONLY_PASSES
            fi
            bash ./link-xenia-ppc-bootstrap.sh
          '

      - name: Run opcode39 and runtime critics
        run: |
          node test-sparse-guest-memory.mjs
          node test-opcode39-main-thread.mjs
          python3 - <<'PY'
          from pathlib import Path
          src=Path('test-guest-runtime-critic.mjs').read_text()
          tail="await import('./test-browser-thread-scheduler.mjs');"
          if tail not in src:
              raise SystemExit('guest runtime critic scheduler marker missing')
          Path('test-guest-runtime-critic-core.ci.mjs').write_text(src.replace(tail,'',1))
          PY
          node test-guest-runtime-critic-core.ci.mjs
          rm test-guest-runtime-critic-core.ci.mjs
          node test-browser-thread-scheduler.mjs
          node test-title-scanned-entry-runtime.mjs

      - name: Publish rebuilt runtime
        run: |
          cp build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm xenia_ppc_bootstrap.wasm
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('xenia_ppc_bootstrap.meta.json')
          data=json.loads(p.read_text()) if p.exists() else {}
          data['runtimeFix']='opcode39-authoritative-sparse-memory-v4'
          data['browserCache']='44.7'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/xenia_web_bootstrap/hir_correctness_executor.cpp prepare-title-runtime-memory-overlay.py render360-title-controller.mjs render360-browser-modern-content-bridge.mjs render360-browser-title-runtime.mjs runtime/render360-runtime.js app-v41.js index.html xenia_ppc_bootstrap.wasm xenia_ppc_bootstrap.meta.json
          git diff --cached --check
          git commit -m 'fix: execute opcode39 against authoritative title memory' || exit 0
          git push origin HEAD:main
