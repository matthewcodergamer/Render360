name: Render360 V44 main-thread context hotfix

on:
  push:
    paths:
      - '.github/workflows/r360-v44-main-thread-context-hotfix.yml'
      - 'tools/r360_main_thread_context_hotfix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Xbox main-thread runtime context
        run: python3 tools/r360_main_thread_context_hotfix.py
      - name: Validate browser modules
        run: |
          node --check render360-title-controller.mjs
          node --check render360-browser-modern-content-bridge.mjs
          node --check runtime/render360-runtime.js
          node --check app-v41.js
          git diff --check
      - name: Commit runtime hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render360-title-controller.mjs render360-browser-modern-content-bridge.mjs runtime/render360-runtime.js app-v41.js index.html
          git diff --cached --check
          git commit -m 'fix: initialize Xbox title main-thread context' || exit 0
          git push origin HEAD:main
