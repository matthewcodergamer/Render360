name: Render360 V44 Runtime Hotfix
on:
  push:
    paths:
      - '.github/workflows/r360-v44-runtime-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              if new == old:
                  print(f'NO_CHANGE {path}')
              else:
                  p.write_text(new)
                  print(f'UPDATED {path}')

          # Force iOS/Safari to request a completely fresh commercial-title module graph.
          edit('index.html', lambda s: s.replace('?v=44"', '?v=44.2"'))
          edit('app-v41.js', lambda s: s.replace('./runtime/render360-runtime.js?v=44', './runtime/render360-runtime.js?v=44.2'))
          edit('runtime/render360-runtime.js', lambda s: s.replace('../render360-browser-modern-iso-bridge.mjs?v=44', '../render360-browser-modern-iso-bridge.mjs?v=44.2').replace('../render360-browser-modern-content-bridge.mjs?v=44', '../render360-browser-modern-content-bridge.mjs?v=44.2'))
          edit('render360-browser-modern-iso-bridge.mjs', lambda s: s.replace("'./render360-browser-title-runtime.mjs'", "'./render360-browser-title-runtime.mjs?v=44.2'"))

          # Safety net: if generated-WASM still reports zero callable entries, execute the
          # already-supported native HIR compatibility tier instead of surfacing the old
          # scheduler error. This is generic for any title, not hard-coded to Braid.
          def patch_title_runtime(s):
              marker = "  const resetRuntime=pick(runtime.exports,'r360_kernel_runtime_reset');\n"
              if 'forced-native-hir-after-empty-generated-wasm' in s:
                  return s
              block = """  const generatedFunctionCount=(pick(runtime.exports,'r360_wasm_backend_call_function_count')?.()??0)>>>0;\n  if(!generatedFunctionCount){\n    console.warn(`[Render360] Generated-WASM emitter produced 0 callable functions for 0x${(result.entry>>>0).toString(16)}; forcing native HIR compatibility execution`);\n    const fallbackResult=await handoffXboxIso({core,bootstrap:runtime,isoSource:file,scanEntryFunction,executeDuringTranslation:true,executeHirCompatibilityFallback:false,...options});\n    const completed=(fallbackResult.executionStatus>>>0)===3;\n    const schedulerBlocker=completed?null:{\n      kind:'native-hir-compatibility-boundary',\n      entry:fallbackResult.entry>>>0,\n      message:`Native HIR compatibility execution stopped at ${fallbackResult.runtimeBoundary}`,\n      executionStatus:fallbackResult.executionStatus>>>0,\n      executionInstructions:fallbackResult.executionInstructions>>>0,\n      reachedKernelBlocker:fallbackResult.reachedKernelBlocker??null,\n    };\n    fallbackResult.compatibilityExecution={\n      used:true,\n      reason:'forced-native-hir-after-empty-generated-wasm',\n      entry:fallbackResult.entry>>>0,\n      executionStatus:fallbackResult.executionStatus>>>0,\n      executionInstructions:fallbackResult.executionInstructions>>>0,\n      runtimeBoundary:fallbackResult.runtimeBoundary,\n      reachedKernelBlocker:fallbackResult.reachedKernelBlocker??null,\n    };\n    fallbackResult.commercialCpu={\n      mode:'native-hir-compatibility-fallback',\n      translationSideEffects:true,\n      primaryThread:null,\n      firstPump:null,\n      blocker:schedulerBlocker,\n      callableFunctionCount:0,\n      compatibility:fallbackResult.compatibilityExecution,\n      schedulerContract:guestThreadSchedulerContract(),\n    };\n    return {bootstrap:runtime,result:fallbackResult,ppcSession:null,threadScheduler:null,primaryThread:null,schedulerReport:null,schedulerBlocker};\n  }\n\n"""
              if marker not in s:
                  raise SystemExit('title-runtime injection marker missing')
              return s.replace(marker, block + marker, 1).replace('?v=44.1', '?v=44.2')
          edit('render360-browser-title-runtime.mjs', patch_title_runtime)

          # Hundreds of one-row-per-HIR-op console errors were growing the DOM and helping
          # WebKit kill/reload the page. Keep actionable backend summaries, suppress only
          # the repetitive instruction trace, and keep a smaller bounded console history.
          def patch_console(s):
              s = s.replace('const MAX_LOGS=1000;', 'const MAX_LOGS=300;')
              old = "const wrapped=(...args)=>{original(...args);const text=args.map(argText).join(' ');if(/Render360|R360|Xenia|Xenos|STFS|XEX|PM4/i.test(text)||name==='warn'||name==='error')addLog(name==='log'?'info':name,text,{source:`console.${name}`,stage:lastStageKey});};"
              new = "const wrapped=(...args)=>{original(...args);const text=args.map(argText).join(' ');if(/^R360_HIR\\s+block=/i.test(text))return;if(/Render360|R360|Xenia|Xenos|STFS|XEX|PM4/i.test(text)||name==='warn'||name==='error')addLog(name==='log'?'info':name,text,{source:`console.${name}`,stage:lastStageKey});};"
              if old not in s and new not in s:
                  raise SystemExit('developer-console capture marker missing')
              return s.replace(old, new)
          edit('developer-console-v44.js', patch_console)

          # Make this release visibly unambiguous in browser logs.
          edit('runtime/render360-runtime.js', lambda s: s.replace('const RELEASE=44;', 'const RELEASE=44;\nconst RUNTIME_HOTFIX="44.2";') if 'RUNTIME_HOTFIX="44.2"' not in s else s)
          PY

          git diff --check
          git diff --stat
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'Render360 CI Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html app-v41.js runtime/render360-runtime.js render360-browser-modern-iso-bridge.mjs render360-browser-title-runtime.mjs developer-console-v44.js
          git commit -m 'Runtime: bypass zero-function PPC blocker on Safari'
          git push
