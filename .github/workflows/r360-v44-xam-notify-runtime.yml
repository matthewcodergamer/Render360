name: Render360 V44 XAM notification runtime

on:
  push:
    paths:
      - '.github/workflows/r360-v44-xam-notify-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Xenia-compatible XAM notification starter services
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/xenia_web_bootstrap/kernel_runtime_foundation.cpp')
          s=p.read_text()

          old='''uint32_t g_last_module = 0;\nuint32_t g_last_ordinal = 0;'''
          new='''uint32_t g_last_module = 0;\nuint32_t g_last_ordinal = 0;\nuint32_t g_next_notify_handle = 0x37000001u;'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'g_next_notify_handle' not in s:
              raise SystemExit('notification handle state anchor changed')

          old='''uint32_t ServiceCall(uint32_t module, uint32_t ordinal,\n                     uint32_t r3, uint32_t r4, uint32_t, uint32_t,\n                     uint32_t, uint32_t, uint32_t, uint32_t) {'''
          new='''uint32_t ServiceCall(uint32_t module, uint32_t ordinal,\n                     uint32_t r3, uint32_t r4, uint32_t r5, uint32_t r6,\n                     uint32_t, uint32_t, uint32_t, uint32_t) {'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'uint32_t r3, uint32_t r4, uint32_t r5, uint32_t r6' not in s:
              raise SystemExit('service ABI signature anchor changed')

          old='''  if (module == kModuleXam) {\n    switch (ordinal) {\n      case 0x03CD:  // XGetLanguage - XLanguage::kEnglish in Xenia default path.\n        return 1u;\n      default:\n        g_service_status = kStatusUnsupported;\n        return 0;\n    }\n  }'''
          new='''  if (module == kModuleXam) {\n    switch (ordinal) {\n      case 0x028A: {  // XamNotifyCreateListener\n        // Xenia returns a kernel object handle. The browser runtime does not\n        // yet need queued dashboard notifications during title startup, but it\n        // must return a stable non-zero listener handle so titles can poll it.\n        const uint32_t handle = g_next_notify_handle++;\n        if (!g_next_notify_handle) g_next_notify_handle = 0x37000001u;\n        return handle;\n      }\n      case 0x028B: {  // XNotifyGetNext\n        // Match Xenia's empty-queue behavior: zero optional param first, require\n        // an id pointer for output, zero id, then report no dequeued event.\n        // Guest pointers are Xbox virtual addresses, so use sparse guest memory\n        // and preserve big-endian dword representation.\n        const uint32_t zero = 0;\n        if (r6 && !WriteSparseGuestMemory(r6, &zero, sizeof(zero))) {\n          g_service_status = kStatusInvalid;\n          return 0;\n        }\n        if (!r5) return 0;\n        if (!WriteSparseGuestMemory(r5, &zero, sizeof(zero))) {\n          g_service_status = kStatusInvalid;\n          return 0;\n        }\n        return 0;\n      }\n      case 0x028C:  // XNotifyPositionUI - ignored by Xenia.\n      case 0x028D:  // XNotifyDelayUI - ignored by Xenia.\n        return 0;\n      case 0x03CD:  // XGetLanguage - XLanguage::kEnglish in Xenia default path.\n        return 1u;\n      default:\n        g_service_status = kStatusUnsupported;\n        return 0;\n    }\n  }'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'case 0x028B' not in s:
              raise SystemExit('XAM service switch anchor changed')
          p.write_text(s)

          p=Path('test-kernel-services-critic.mjs')
          t=p.read_text()
          old="""if(call(2,0x3CD)!==1)throw new Error('XGetLanguage mismatch');\nconsole.log('KERNEL_SERVICE_XENIA_ORDINALS=PASS');console.log('KERNEL_SERVICE_XBOXKRNL_SEMANTICS=PASS');console.log('KERNEL_SERVICE_XAM_SEMANTICS=PASS');"""
          new="""if(call(2,0x3CD)!==1)throw new Error('XGetLanguage mismatch');\nconst notifyHandle=call(2,0x28A,0,0);if(!notifyHandle)throw new Error('XamNotifyCreateListener returned null handle');\nif(call(2,0x28B,notifyHandle,0,0,0)!==0||(pick('r360_kernel_service_status')()>>>0)!==1)throw new Error('XNotifyGetNext empty-queue semantics mismatch');\nif(call(2,0x28C,0)!==0||call(2,0x28D,0)!==0)throw new Error('XNotify UI stub semantics mismatch');\nconsole.log('KERNEL_SERVICE_XENIA_ORDINALS=PASS');console.log('KERNEL_SERVICE_XBOXKRNL_SEMANTICS=PASS');console.log('KERNEL_SERVICE_XAM_NOTIFY_SEMANTICS=PASS');console.log('KERNEL_SERVICE_XAM_SEMANTICS=PASS');"""
          if old in t:
              t=t.replace(old,new,1)
          elif 'KERNEL_SERVICE_XAM_NOTIFY_SEMANTICS=PASS' not in t:
              raise SystemExit('kernel service critic anchor changed')
          p.write_text(t)

          for needle in ['case 0x028A','case 0x028B','case 0x028C','case 0x028D','WriteSparseGuestMemory(r5','KERNEL_SERVICE_XAM_NOTIFY_SEMANTICS=PASS']:
              if needle not in Path('src/xenia_web_bootstrap/kernel_runtime_foundation.cpp').read_text()+Path('test-kernel-services-critic.mjs').read_text():
                  raise SystemExit(f'missing XAM notification marker {needle}')
          PY

          git diff --check

      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/xenia_web_bootstrap/kernel_runtime_foundation.cpp test-kernel-services-critic.mjs
          git diff --cached --check
          git commit -m 'fix: bridge XAM notification startup services' || exit 0
          git push origin HEAD:main
