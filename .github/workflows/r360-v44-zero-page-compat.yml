name: Render360 V44 zero-page title compatibility

on:
  push:
    paths:
      - '.github/workflows/r360-v44-zero-page-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add title-only zero-page compatibility mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('render360-title-controller.mjs')
          s=p.read_text()

          old="""  const stackBacking=alloc(stackPages)>>>0;\n  if(!stackBacking||(map(stackBase,stackPages,stackBacking,0,readWrite)>>>0)!==1)throw new Error('unable to map Xbox main-thread stack');\n  const contextBacking=alloc(contextPages)>>>0;\n  if(!contextBacking||(map(pcrAddress,contextPages,contextBacking,0,readWrite)>>>0)!==1)throw new Error('unable to map Xbox main-thread PCR/TLS');"""
          new="""  // Compatibility fallback for the native-HIR title path. The current Braid\n  // entry sequence performs a 32-bit read through guest address 0 before any\n  // kernel import is called. Xenia's normal virtual-memory backend has a full\n  // guest address aperture, while Render360's strict sparse-memory path treated\n  // page zero as an immediate unmapped dependency failure. Map one private,\n  // zero-filled page only for this title execution context so a null-page read\n  // observes zero and execution can continue to the next real dependency.\n  // This is deliberately title-context-local rather than a global HIR hack.\n  const zeroPageBacking=alloc(1)>>>0;\n  if(!zeroPageBacking||(map(0,1,zeroPageBacking,0,readWrite)>>>0)!==1)throw new Error('unable to map title compatibility zero page');\n\n  const stackBacking=alloc(stackPages)>>>0;\n  if(!stackBacking||(map(stackBase,stackPages,stackBacking,0,readWrite)>>>0)!==1)throw new Error('unable to map Xbox main-thread stack');\n  const contextBacking=alloc(contextPages)>>>0;\n  if(!contextBacking||(map(pcrAddress,contextPages,contextBacking,0,readWrite)>>>0)!==1)throw new Error('unable to map Xbox main-thread PCR/TLS');"""
          if old not in s:
              if 'unable to map title compatibility zero page' not in s:
                  raise SystemExit('main-thread sparse mapping anchor changed')
          else:
              s=s.replace(old,new,1)

          old_return="return {kind:'xenia-main-thread-context',stackBase,stackLimit,stackBasePointer,stackTop,xeniaCallFrameBytes,pcrAddress,tlsAddress,threadAddress,startAddress:entry>>>0,stackBytes:stackPages*pageSize};"
          new_return="return {kind:'xenia-main-thread-context',stackBase,stackLimit,stackBasePointer,stackTop,xeniaCallFrameBytes,pcrAddress,tlsAddress,threadAddress,startAddress:entry>>>0,stackBytes:stackPages*pageSize,zeroPageCompat:true};"
          if old_return in s:
              s=s.replace(old_return,new_return,1)
          elif new_return not in s:
              raise SystemExit('main-thread return telemetry anchor changed')
          p.write_text(s)

          # Bust the complete iOS module chain so Safari cannot keep the old
          # title controller alive after the Pages deployment.
          replacements={
            'render360-browser-modern-content-bridge.mjs': [
              ('render360-title-controller.mjs?v=44.8','render360-title-controller.mjs?v=44.9'),
              ('render360-browser-title-runtime.mjs?v=44.8','render360-browser-title-runtime.mjs?v=44.9'),
            ],
            'runtime/render360-runtime.js': [
              ('render360-browser-modern-content-bridge.mjs?v=44.8','render360-browser-modern-content-bridge.mjs?v=44.9'),
            ],
            'app-v41.js': [
              ('runtime/render360-runtime.js?v=44.8','runtime/render360-runtime.js?v=44.9'),
            ],
            'index.html': [
              ('app-v41.js?v=44.8','app-v41.js?v=44.9'),
              ('app-v42-patch.js?v=44.8','app-v42-patch.js?v=44.9'),
            ],
          }
          for name,pairs in replacements.items():
              q=Path(name)
              t=q.read_text()
              for a,b in pairs:
                  t=t.replace(a,b)
              q.write_text(t)

          text=Path('render360-title-controller.mjs').read_text()
          required=[
            'const zeroPageBacking=alloc(1)>>>0;',
            "map(0,1,zeroPageBacking,0,readWrite)",
            'zeroPageCompat:true',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'missing zero-page compatibility markers: {missing}')
          print('R360_TITLE_ZERO_PAGE_COMPAT=ENABLED')
          print('R360_ZERO_PAGE_SCOPE=TITLE_MAIN_THREAD_ONLY')
          print('R360_BROWSER_CACHE_CHAIN=44.9')
          PY

          node --check render360-title-controller.mjs
          node --check render360-browser-modern-content-bridge.mjs
          node --check runtime/render360-runtime.js
          node --check app-v41.js
          git diff --check

      - name: Commit workaround
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render360-title-controller.mjs render360-browser-modern-content-bridge.mjs runtime/render360-runtime.js app-v41.js index.html
          git diff --cached --check
          git commit -m 'fix: continue title HIR across zero-page startup read' || exit 0
          git push origin HEAD:main
