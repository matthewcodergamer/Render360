name: Render360 XeniOS UI Cache Bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r360-xenios-ui-cachebust.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump live UI module entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          old='app-v42-patch.js?v=44.11'
          new='app-v42-patch.js?v=44.13'
          if old not in text and new not in text:
              raise SystemExit('app-v42 entrypoint not found')
          p.write_text(text.replace(old,new))
          PY
      - name: Commit cache-busted entrypoint
        run: |
          if git diff --quiet -- index.html; then
            echo 'UI entrypoint already cache-busted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'design: cache-bust XeniOS-inspired UI entrypoint'
          git push
