name: Render360 XeniOS UI Entrypoint Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r360-xenios-ui-entrypoint.yml'

permissions:
  contents: write

jobs:
  patch-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V44.13 UI module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-v42-patch.js')
          text=p.read_text()
          line="import './render360-xenios-ui.mjs?v=44.13';"
          if line not in text:
              marker="import './render360-browser-features.mjs?v=44.11';"
              if marker not in text:
                  raise SystemExit('browser feature import marker missing')
              text=text.replace(marker, marker+'\n'+line, 1)
              p.write_text(text)
          PY
      - name: Commit UI entrypoint
        run: |
          if git diff --quiet -- app-v42-patch.js; then
            echo 'XeniOS UI entrypoint already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v42-patch.js
          git commit -m 'design: load XeniOS-inspired iOS UI layer'
          git push
