name: Render360 XeniOS iOS UI Critic

on:
  push:
    branches: [main]
    paths:
      - 'render360-xenios-ui.mjs'
      - 'ui-v44-xenios.css'
      - 'app-v42-patch.js'
      - 'app-v41.js'
      - 'test-xenios-ui-contract.mjs'
      - '.github/workflows/r360-xenios-ui.yml'
  pull_request:
    paths:
      - 'render360-xenios-ui.mjs'
      - 'ui-v44-xenios.css'
      - 'app-v42-patch.js'
      - 'app-v41.js'
      - 'test-xenios-ui-contract.mjs'

permissions:
  contents: read

jobs:
  xenios-ios-ui-critic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse UI modules
        run: |
          node --check render360-xenios-ui.mjs
          node --check app-v42-patch.js
      - name: Verify UI integration contract
        run: node test-xenios-ui-contract.mjs
