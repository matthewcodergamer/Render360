name: Render360 Browser XInput V48

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-browser-xinput-v48.py'
      - '.github/workflows/render360-browser-xinput-v48.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render360-browser-xinput-v48
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Apply browser XInput bridge
        run: python3 tools/apply-browser-xinput-v48.py
      - name: Validate browser runtime
        run: node --check runtime/render360-runtime.js
      - name: Commit bridge
        run: |
          git config user.name 'render360-ci'
          git config user.email 'render360-ci@users.noreply.github.com'
          git add src/xenia_web_bootstrap/kernel_runtime_foundation.cpp runtime/render360-runtime.js .github/workflows/xenia-wasm32-bootstrap.yml
          if git diff --cached --quiet; then
            echo 'Browser XInput bridge already applied.'
            exit 0
          fi
          git commit -m 'feat: bridge browser controls into XamInputGetState'
          git push origin HEAD:main
