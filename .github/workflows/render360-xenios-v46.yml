name: Render360 XeniOS V46

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render360-xenios-v46.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply XeniOS v46 UI patch
        run: python3 tools/apply-xenios-v46-ui.py
      - name: Verify JavaScript syntax
        run: |
          node --check ui-behavior.js
          node --check developer-console.js
          node --check developer-console-fab.js
      - name: Verify XeniOS v46 UI contract
        run: node test-xenios-v46-ui.mjs
      - name: Verify canonical UI contract
        run: node test-ui-contract.mjs
      - name: Commit product changes
        run: |
          git config user.name 'render360-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add ui-behavior.js developer-console.js styles/mobile-safari-fixes.css test-xenios-v46-ui.mjs
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore console and polish XeniOS library layout'
          git push
