name: Retry V75 HalReturnToFirmware Boundary

on:
  push:
    branches: [main]
    paths:
      - 'tools/run-hal-return-to-firmware-v75.py'
      - '.github/workflows/retry-hal-return-to-firmware-v75.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: retry-hal-return-to-firmware-v75
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate V75 updater wrapper and regression syntax
        run: |
          python3 -m py_compile tools/apply-hal-return-to-firmware-v75.py tools/run-hal-return-to-firmware-v75.py
          node --check test-kernel-hal-return-to-firmware-v75.mjs

      - name: Apply Xenia-faithful firmware terminal boundary
        run: python3 tools/run-hal-return-to-firmware-v75.py

      - name: Verify V75 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = '75'
          grep -q 'kStatusTerminal = 4' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'case 0x0028:  // HalReturnToFirmware' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'r360_kernel_service_firmware_requested' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'r360_kernel_service_firmware_routine' src/xenia_web_bootstrap/kernel_runtime_foundation.cpp
          grep -q 'kMaxKernelImportHistory = 32' src/xenia_web_bootstrap/kernel_import_probe.cpp
          grep -q 'r360_kernel_import_history_ordinal' src/xenia_web_bootstrap/kernel_import_probe.cpp
          grep -q "kernelLastStatus===4?'firmware-reentry-request'" render360-title-controller.mjs
          grep -q 'kernelCallHistory' render360-title-controller.mjs
          grep -q 'FIRMWARE_REENTRY_REQUEST' developer-console.js
          grep -q 'blockerMessage(source,detail)' developer-console.js
          grep -q 'const RENDER360_RELEASE=75;' runtime/render360-runtime.js
          grep -q 'const REQUIRED_CORE_BUILD=75;' runtime/render360-runtime.js
          grep -q 'const CONTENT_BRIDGE={release:75,' runtime/render360-runtime.js
          grep -q 'const RENDER360_RELEASE=75;' render360-browser-title-runtime.mjs
          grep -q "const VERSION='75';" render360-sw.js
          grep -q 'Render360 75' index.html
          grep -q '<span>UI Release</span><span class="value">75</span>' index.html
          node --check render360-title-controller.mjs
          node --check render360-browser-title-runtime.mjs
          node --check render360-browser-modern-content-bridge.mjs
          node --check developer-console.js
          node --check runtime/render360-runtime.js

      - name: Commit V75 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Render360 V75 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/xenia_web_bootstrap/kernel_runtime_foundation.cpp \
            src/xenia_web_bootstrap/kernel_import_probe.cpp \
            src/xenia_web_bootstrap/kernel_import_probe.h \
            render360-title-controller.mjs \
            render360-browser-title-runtime.mjs \
            render360-browser-modern-content-bridge.mjs \
            developer-console.js \
            runtime/render360-runtime.js \
            render360-sw.js \
            index.html \
            VERSION
          if git diff --cached --quiet; then
            echo 'V75 source already applied.'
          else
            git commit -m 'V75: model HalReturnToFirmware terminal boundary'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish synchronized V75 package core first
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sync-package-core.yml --ref main
          sleep 5
          run_id="$(gh run list --workflow sync-package-core.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "V75 package-core run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Build verify and publish V75 browser bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run xenia-browser-bootstrap-fastlane.yml --ref main
          sleep 5
          run_id="$(gh run list --workflow xenia-browser-bootstrap-fastlane.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "V75 bootstrap run: $run_id"
          gh run watch "$run_id" --exit-status

      - name: Regress firmware terminal semantics and prior V74 relocation
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node ./test-kernel-hal-return-to-firmware-v75.mjs ./xenia_ppc_bootstrap.wasm
          node ./test-kernel-debug-monitor-variable.mjs ./xenia_ppc_bootstrap.wasm
          node ./test-kernel-variable-import-relocation.mjs ./xenia_ppc_bootstrap.wasm
          node ./test-render360-version-consistency.mjs

      - name: Verify final V75 metadata
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const version=Number(fs.readFileSync('VERSION','utf8').trim());
          const pkg=JSON.parse(fs.readFileSync('render360_xenia_core.meta.json','utf8'));
          const boot=JSON.parse(fs.readFileSync('xenia_ppc_bootstrap.meta.json','utf8'));
          if(version!==75||Number(pkg.release)!==75||Number(boot.release)!==75)throw new Error(JSON.stringify({version,pkg:pkg.release,boot:boot.release}));
          console.log('R360_V75_FINAL_RELEASE_PARITY=PASS');
          NODE
