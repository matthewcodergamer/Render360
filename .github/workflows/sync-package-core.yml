name: Sync Package Core

on:
  push:
    branches: [main]
    paths:
      - 'build-core.sh'
      - 'package-core.cpp'
      - 'render360_xenia_core.cpp'
      - 'render360_xenia_core_v32.cpp'
      - 'src/xenia_web_bootstrap/xex_image_decoder.cpp'
      - 'src/xenia_web_bootstrap/xex_image_decoder.h'
      - 'src/xenia_web_bootstrap/xex_image_decoder_exports.cpp'
      - 'src/xenia_web_bootstrap/xex_image_preparer.cpp'
      - 'src/xenia_web_bootstrap/xex_image_preparer.h'
      - 'src/xenia_web_bootstrap/xex_image_preparer_exports.cpp'
      - 'src/xenia_web_bootstrap/xex_pe_image.cpp'
      - 'src/xenia_web_bootstrap/xex_pe_image.h'
      - 'src/xenia_web_bootstrap/xex_pe_image_exports.cpp'
      - 'test-package-xex-foundation.mjs'
      - 'test-render360-version-consistency.mjs'
      - 'tools/embed-render360-core.py'
      - 'VERSION'
      - '.github/workflows/sync-package-core.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render360-package-core-main
  cancel-in-progress: true

jobs:
  build-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build synchronized package WASM
        run: |
          clang++ --version
          bash build-core.sh
      - name: Verify rebuilt commercial-title package contract
        run: node test-package-core-artifact-contract.mjs
      - name: Regress package/XEX foundation
        run: node test-package-xex-foundation.mjs
      - name: Regress XEX image decode and preparation
        run: |
          node test-xex-image-decode.mjs
          node test-xex-image-prepare-none.mjs
          node test-xex-image-prepare-basic.mjs
          node test-xex-image-prepare-normal-frame.mjs
          node test-xex-pe-image.mjs
      - name: Regenerate embedded fallback from exact WASM
        run: python3 tools/embed-render360-core.py
      - name: Verify embedded and network core hashes
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,re
          from pathlib import Path
          raw=Path('render360_xenia_core.wasm').read_bytes()
          js=Path('render360_xenia_core_embedded.js').read_text()
          b64=re.search(r"CORE_WASM_GZIP_BASE64='([^']+)'",js).group(1)
          emb=gzip.decompress(base64.b64decode(b64))
          assert emb==raw, 'embedded package core differs from network WASM'
          print('PACKAGE_CORE_BYTES_SYNC PASS',hashlib.sha256(raw).hexdigest(),len(raw))
          PY
      - name: Verify one Render360 release across package artifacts
        run: node test-render360-version-consistency.mjs --allow-bootstrap-pending
      - name: Commit synchronized generated artifacts
        run: |
          if git diff --quiet -- render360_xenia_core.wasm render360_xenia_core_embedded.js render360_xenia_core.meta.json; then
            echo 'Package core already synchronized.'
            exit 0
          fi
          R360_VERSION="$(tr -d '[:space:]' < VERSION)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add render360_xenia_core.wasm render360_xenia_core_embedded.js render360_xenia_core.meta.json
          git commit -m "build: publish synchronized package core V${R360_VERSION}"
          git push origin HEAD:main
