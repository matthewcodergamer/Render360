name: Render360 Browser Integration

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'ui.js'
      - 'ui-behavior.js'
      - 'developer-console.js'
      - 'styles/**'
      - 'wasm-core.js'
      - 'runtime-host.js'
      - 'runtime-worker.js'
      - 'render360-stfs-browser-extractor.mjs'
      - 'library/**'
      - 'import/**'
      - 'profiles/**'
      - 'runtime/**'
      - 'settings/**'
      - 'storage/**'
      - 'render360-browser-modern-content-bridge.mjs'
      - 'render360-browser-modern-iso-bridge.mjs'
      - 'render360-browser-thread-scheduler.mjs'
      - 'render360-browser-title-runtime.mjs'
      - 'render360-title-controller.mjs'
      - 'render360-title-gpu-traffic.mjs'
      - 'render360-title-frontbuffer.mjs'
      - 'render360_xenia_core.wasm'
      - 'render360_xenia_core.meta.json'
      - 'xenia_ppc_bootstrap.wasm'
      - 'xenia_ppc_bootstrap.meta.json'
      - 'manifest.webmanifest'
      - 'render360-sw.js'
      - 'VERSION'
      - 'test-ui-contract.mjs'
      - 'test-stfs-browser-extractor.mjs'
      - 'test-package-core-artifact-contract.mjs'
      - 'test-runtime-asset-identity.mjs'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'ui.js'
      - 'ui-behavior.js'
      - 'developer-console.js'
      - 'styles/**'
      - 'wasm-core.js'
      - 'runtime-host.js'
      - 'runtime-worker.js'
      - 'render360-stfs-browser-extractor.mjs'
      - 'library/**'
      - 'import/**'
      - 'profiles/**'
      - 'runtime/**'
      - 'settings/**'
      - 'storage/**'
      - 'render360-browser-modern-content-bridge.mjs'
      - 'render360-browser-modern-iso-bridge.mjs'
      - 'render360-browser-thread-scheduler.mjs'
      - 'render360-browser-title-runtime.mjs'
      - 'render360-title-controller.mjs'
      - 'render360-title-gpu-traffic.mjs'
      - 'render360-title-frontbuffer.mjs'
      - 'render360_xenia_core.wasm'
      - 'render360_xenia_core.meta.json'
      - 'xenia_ppc_bootstrap.wasm'
      - 'xenia_ppc_bootstrap.meta.json'
      - 'manifest.webmanifest'
      - 'render360-sw.js'
      - 'VERSION'
      - 'test-ui-contract.mjs'
      - 'test-stfs-browser-extractor.mjs'
      - 'test-package-core-artifact-contract.mjs'
      - 'test-runtime-asset-identity.mjs'
      - '.github/workflows/ui.yml'

permissions:
  contents: read

jobs:
  integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse browser modules
        run: |
          node --check app.js
          node --check ui.js
          node --check ui-behavior.js
          node --check developer-console.js
          node --check wasm-core.js
          node --check runtime-host.js
          node --check runtime-worker.js
          node --check render360-stfs-browser-extractor.mjs
          node --check runtime/render360-runtime.js
          node --check runtime/title-controls.js
          node --check render360-browser-modern-content-bridge.mjs
          node --check render360-browser-thread-scheduler.mjs
          node --check storage/game-storage.js
          node --check settings/app-settings-store.js
          node --check library/game-library.js
          node --check library/cover-resolver.js
          node --check import/zip-importer.js
          node --check profiles/title-profile-store.js
      - name: Enforce canonical browser contract
        run: |
          node test-ui-contract.mjs
          node test-runtime-asset-identity.mjs
      - name: Verify checked-in package WASM artifact
        run: node test-package-core-artifact-contract.mjs
      - name: Regress STFS extraction compatibility
        run: node test-stfs-browser-extractor.mjs
      - name: Stage published bootstrap for scheduler test
        run: |
          mkdir -p build/xenia-ppc-bootstrap
          cp xenia_ppc_bootstrap.wasm build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Regress deployed guest scheduler
        run: node test-browser-thread-scheduler.mjs
