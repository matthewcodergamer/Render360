name: Xenia Browser Bootstrap Fastlane

on:
  push:
    branches: [main]
    paths:
      - 'prepare-wasm-backend-cfg-overlay.py'
      - 'prepare-vmx-executor-overlay.py'
      - 'prepare-title-runtime-memory-overlay.py'
      - 'prepare-hir-call-return-stack-overlay.py'
      - 'prepare-hir-return-metadata-v3-overlay.py'
      - 'prepare-hir-stack-history-overlay.py'
      - 'prepare-hir-tail-frame-overlay.py'
      - 'tools/apply-xenia-entry-abi-v51.py'
      - 'tools/apply-xenia-epilog-tail-v57.py'
      - 'tools/apply-xenia-epilog-inline-v58.py'
      - 'render360-browser-ppc-session.mjs'
      - 'render360-browser-thread-scheduler.mjs'
      - 'render360-browser-title-runtime.mjs'
      - 'render360-title-controller.mjs'
      - 'test-wasm-backend-cfg.mjs'
      - 'test-wasm-backend-calls.mjs'
      - 'test-browser-thread-scheduler.mjs'
      - 'test-direct-call-sparse-window.mjs'
      - 'test-hir-load-offset-addressing.mjs'
      - 'test-hir-cache-control.mjs'
      - 'test-hir-rotate-left.mjs'
      - 'test-xenia-entry-lr-abi.mjs'
      - 'test-kernel-rtl-image-xex-header-field.mjs'
      - 'test-kernel-nt-allocate-virtual-memory.mjs'
      - 'test-xex-guest-mapper.mjs'
      - 'test-braid-frame-history.mjs'
      - 'build-xenia-ppc-bootstrap.sh'
      - 'link-xenia-ppc-bootstrap.sh'
      - 'src/xenia_web_bootstrap/**'
      - '.github/workflows/xenia-browser-bootstrap-fastlane.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xenia-browser-bootstrap-fastlane
  cancel-in-progress: true

env:
  # Pin the toolchain so a new emsdk image/release cannot silently change the
  # browser ABI or force a multi-gigabyte Docker pull in the critical path.
  EM_VERSION: '5.0.1'
  EMSDK_CACHE_FOLDER: 'emsdk-cache'
  XENIA_REV: '95a5c3ee250f80c3b9d139658649d9ffb6db3eec'
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  R360_BUILD_JOBS: '2'

jobs:
  browser-bootstrap-build:
    name: Build browser bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7

      - name: Verify hardened V58 shared epilog source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MatchSharedEpilogReturnSignature' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'epilog_by_signature' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'uint8_t lr_raw\[4\]' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q 'context->lr = ReadBigEndian32(lr_raw)' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q '0x8181FFF8u' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q '0x7D8803A6u' src/xenia_web_bootstrap/probe_backend.cpp
          grep -q '0x4E800020u' src/xenia_web_bootstrap/probe_backend.cpp
          if grep -q 'uint8_t lr_raw\[8\]' src/xenia_web_bootstrap/probe_backend.cpp; then
            echo 'V58 shared epilog LR restore regressed to 64-bit.' >&2
            exit 1
          fi

      - name: Restore pinned Xenia source cache
        id: xenia-cache
        uses: actions/cache@v6
        with:
          path: upstream/xenia
          key: render360-xenia-${{ runner.os }}-${{ env.XENIA_REV }}

      - name: Fetch pinned upstream Xenia
        shell: bash
        run: |
          echo "R360_PHASE fetch-xenia start=$(date -u +%FT%TZ)"
          bash ./fetch-xenia.sh
          echo "R360_PHASE fetch-xenia done=$(date -u +%FT%TZ)"

      - name: Verify Braid frame-history instrumentation contract
        run: node ./test-braid-frame-history.mjs

      - name: Restore C/C++ compile cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: render360-ccache-${{ runner.os }}-emscripten-${{ env.EM_VERSION }}-xenia-${{ env.XENIA_REV }}-${{ github.ref_name }}
          restore-keys: |
            render360-ccache-${{ runner.os }}-emscripten-${{ env.EM_VERSION }}-xenia-${{ env.XENIA_REV }}-

      - name: Setup pinned Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE_FOLDER }}

      - name: Prepare native build helpers
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if ! command -v ccache >/dev/null 2>&1; then
            packages+=(ccache)
          fi
          llvm_include="$(llvm-config --includedir 2>/dev/null || true)"
          if [ -z "$llvm_include" ] || [ ! -f "$llvm_include/llvm/IR/Module.h" ]; then
            packages+=(llvm-dev)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            echo "Installing missing host helpers only: ${packages[*]}"
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${packages[@]}" >/dev/null
          else
            echo "Host ccache and LLVM development headers are already available."
          fi
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache --zero-stats
          echo "emcc=$(command -v emcc)"
          echo "em++=$(command -v em++)"
          echo "ccache=$(command -v ccache)"
          echo "llvm-config=$(command -v llvm-config || true)"
          emcc -v

      - name: Build and link browser bootstrap
        shell: bash
        env:
          # Emscripten invokes ccache around its Clang compiler. ccache hashes
          # the preprocessed input, so unchanged Xenia translation units are
          # reused safely even when a Render360 overlay changes elsewhere.
          EM_COMPILER_WRAPPER: ccache
        run: |
          set -o pipefail
          echo "R360_PHASE bootstrap-build start=$(date -u +%FT%TZ) jobs=$R360_BUILD_JOBS"
          { bash ./build-xenia-ppc-bootstrap.sh && bash ./link-xenia-ppc-bootstrap.sh; } \
            2>&1 | tee browser-bootstrap-build.log
          echo "R360_PHASE bootstrap-build done=$(date -u +%FT%TZ)"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Upload bootstrap build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-bootstrap-build-log
          path: |
            browser-bootstrap-build.log
            build/xenia-ppc-bootstrap/report.tsv
            build/xenia-ppc-bootstrap/link.log
            build/xenia-ppc-bootstrap/link-report.txt
            build/xenia-ppc-bootstrap/*.o.log
          if-no-files-found: warn
          retention-days: 2

      - name: Upload freshly linked browser bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: xenia-browser-bootstrap-fastlane
          path: |
            build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            build/xenia-ppc-bootstrap/report.tsv
            build/xenia-ppc-bootstrap/link-report.txt
          if-no-files-found: error
          retention-days: 2

  browser-bootstrap-verify:
    name: Verify and publish browser bootstrap
    needs: browser-bootstrap-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v7

      - name: Download freshly linked browser bootstrap
        uses: actions/download-artifact@v8
        with:
          name: xenia-browser-bootstrap-fastlane
          path: build/xenia-ppc-bootstrap

      - name: Verify commercial-title PE staging growth
        run: timeout 90s node ./test-xex-guest-mapper.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify XEX prepared memory-image section sourcing
        run: timeout 90s node ./test-xex-prepared-memory-image-loader.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify resumable integer CFG backend
        run: timeout 90s node ./test-wasm-backend-cfg.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify generated guest calls and Braid LOAD_OFFSET/XAM path
        run: timeout 90s node ./test-wasm-backend-calls.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify browser Xbox thread scheduler
        run: timeout 90s node ./test-browser-thread-scheduler.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify direct calls page executable sparse subwindows
        run: timeout 90s node ./test-direct-call-sparse-window.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify signed PPC LOAD_OFFSET effective addresses
        run: timeout 90s node ./test-hir-load-offset-addressing.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify Braid dcbt HIR cache-control semantics
        run: timeout 90s node ./test-hir-cache-control.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify Braid rlwinm HIR rotate-left semantics
        run: timeout 90s node ./test-hir-rotate-left.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify Xenia title-entry LR ABI
        run: timeout 90s node ./test-xenia-entry-lr-abi.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify RtlImageXexHeaderField kernel service
        run: timeout 90s node ./test-kernel-rtl-image-xex-header-field.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify NtAllocateVirtualMemory kernel service
        run: timeout 90s node ./test-kernel-nt-allocate-virtual-memory.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm

      - name: Verify browser bootstrap runtime contract
        run: |
          mkdir -p .fastlane-published
          cp build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm .fastlane-published/xenia_ppc_bootstrap.wasm
          node ./test-deployed-browser-bootstrap-critic.mjs .fastlane-published/xenia_ppc_bootstrap.wasm

      - name: Publish verified bootstrap to GitHub Pages source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm xenia_ppc_bootstrap.wasm
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('xenia_ppc_bootstrap.wasm')
          data=p.read_bytes()
          meta={
            'sourceCommit': os.environ['SOURCE_COMMIT'],
            'sourceRun': os.environ['SOURCE_RUN'],
            'sha256': hashlib.sha256(data).hexdigest(),
            'bytes': len(data),
          }
          Path('xenia_ppc_bootstrap.meta.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
          git config user.name 'Render360 Browser Bootstrap Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add xenia_ppc_bootstrap.wasm xenia_ppc_bootstrap.meta.json
          if git diff --cached --quiet; then
            echo 'Published bootstrap already matches this verified build.'
            exit 0
          fi
          git commit -m 'build: publish verified browser bootstrap'
          git push origin HEAD:main
