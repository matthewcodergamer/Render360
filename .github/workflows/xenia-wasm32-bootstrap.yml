name: Xenia WASM32 Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'fetch-xenia.sh'
      - 'xenia_contract_check.py'
      - 'xenia_web_bootstrap_check.py'
      - 'xenia_translation_foundation_check.py'
      - 'test-package-xex-foundation.mjs'
      - 'test-xex-image-decode.mjs'
      - 'test-xex-import-libraries.mjs'
      - 'test-kernel-import-plan.mjs'
      - 'test-kernel-hle-bridge.mjs'
      - 'test-kernel-abi-critic.mjs'
      - 'test-kernel-services-critic.mjs'
      - 'test-kernel-import-service-bridge.mjs'
      - 'test-guest-runtime-critic.mjs'
      - 'test-title-kernel-import-integration.mjs'
      - 'test-title-gpu-runtime.mjs'
      - 'render360-title-gpu-traffic.mjs'
      - 'test-xenos-semantic-foundation.mjs'
      - 'test-xenos-title-state-foundation.mjs'
      - 'test-xenos-guest-memory-bridge.mjs'
      - 'test-webgpu-wgsl-edram-foundation.mjs'
      - 'test-xenos-harsh-critic.mjs'
      - 'test-first-genuine-guest-frame.mjs'
      - 'test-first-frame-provenance-critic.mjs'
      - 'render360-xenos-controller.mjs'
      - 'render360-webgpu-xenos.mjs'
      - 'test-xex-image-prepare-none.mjs'
      - 'test-xex-image-prepare-basic.mjs'
      - 'test-xex-image-prepare-normal-frame.mjs'
      - 'test-xex-pe-image.mjs'
      - 'test-xex-pe-guest-loader.mjs'
      - 'test-xex-prepared-entry-handoff.mjs'
      - 'test-xex-retail-normal-end-to-end.mjs'
      - 'test-default-xex-title-controller.mjs'
      - 'test-stfs-package-title-controller.mjs'
      - 'test-title-runtime-boundary.mjs'
      - 'retail-xex-normal-pipeline.mjs'
      - 'retail-xex-image-pipeline.mjs'
      - 'render360-title-controller.mjs'
      - 'render360-package-controller.mjs'
      - 'render360-xex-imports.mjs'
      - 'render360-kernel-imports.mjs'
      - 'test-xenia-lzx-wasm.mjs'
      - 'test-xex-normal-lzx-end-to-end.mjs'
      - 'test-xex-crypto-wasm.mjs'
      - 'test-xex-real-mapper-integration.mjs'
      - 'test-guest-control-foundation.mjs'
      - 'test-fpu-foundation.mjs'
      - 'test-vmx-foundation.mjs'
      - 'test-wasm-backend.mjs'
      - 'test-wasm-backend-cfg.mjs'
      - 'test-wasm-backend-memory.mjs'
      - 'test-wasm-backend-calls.mjs'
      - 'test-wasm-backend-fpu.mjs'
      - 'test-wasm-backend-fpu-semantics.mjs'
      - 'test-wasm-backend-vmx.mjs'
      - 'test-wasm-backend-cache.mjs'
      - 'test-wasm-backend-foundation.mjs'
      - 'test-sparse-guest-memory.mjs'
      - 'test-xex-guest-mapper.mjs'
      - 'wasm-backend-function-cache.mjs'
      - 'render360_xenia_core.cpp'
      - 'render360_xenia_core_v32.cpp'
      - 'render360_xenia_core.wasm'
      - 'render360_xenia_core_embedded.js'
      - 'build-core.sh'
      - 'wasm-core-v32.js'
      - 'xenia_port/**'
      - 'prepare-xenia-*-overlay.py'
      - 'prepare-render360-*-overlay.py'
      - 'prepare-wasm-*-overlay.py'
      - 'prepare-vmx-executor-overlay.py'
      - 'prepare-title-runtime-memory-overlay.py'
      - 'build-xenia-ppc-bootstrap.sh'
      - 'link-xenia-ppc-bootstrap.sh'
      - 'test-xenia-ppc-translation-probe.mjs'
      - 'src/xenia_web_shims/**'
      - 'src/xenia_web_bootstrap/**'
      - 'README.md'
      - 'XENIA_WEB_BOOTSTRAP.md'
      - 'WASM_BACKEND_FOUNDATION.md'
      - 'SPARSE_GUEST_MEMORY_FOUNDATION.md'
      - 'BROWSER_ARCHITECTURE.md'
      - '.github/workflows/xenia-wasm32-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xenia-wasm32-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v4
      - name: Rebuild V32 package/XEX WASM core from source
        run: bash ./build-core.sh
      - name: Verify STFS/XEX package foundation
        run: node ./test-package-xex-foundation.mjs
      - name: Verify strict XEX2 image metadata decode
        run: node ./test-xex-image-decode.mjs
      - name: Verify XEX import library decoding
        run: node ./test-xex-import-libraries.mjs
      - name: Verify kernel import descriptors and first blocker plan
        run: node ./test-kernel-import-plan.mjs
      - name: Verify streaming unencrypted/uncompressed XEX preparation
        run: node ./test-xex-image-prepare-none.mjs
      - name: Verify streaming BASIC XEX preparation
        run: node ./test-xex-image-prepare-basic.mjs
      - name: Verify streaming NORMAL block/hash/chunk framing
        run: node ./test-xex-image-prepare-normal-frame.mjs
      - name: Verify strict Xbox PE image metadata
        run: node ./test-xex-pe-image.mjs
      - name: Fetch upstream Xenia
        run: bash ./fetch-xenia.sh
      - name: Audit Xenia contracts and translation foundation
        run: |
          python3 ./xenia_contract_check.py
          python3 ./xenia_web_bootstrap_check.py
          python3 ./xenia_translation_foundation_check.py
      - name: Compile and link real Xenia PPC/HIR wasm32 bootstrap
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            emscripten/emsdk:latest \
            bash -lc 'apt-get update -qq && apt-get install -y -qq llvm-dev >/dev/null && bash ./build-xenia-ppc-bootstrap.sh && bash ./link-xenia-ppc-bootstrap.sh'
      - name: Verify upstream Xenia LZX decoder in wasm32
        run: node ./test-xenia-lzx-wasm.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify NORMAL framing to Xenia LZX end to end
        run: node ./test-xex-normal-lzx-end-to-end.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify XEX session-key and AES-CBC semantics in wasm32
        run: node ./test-xex-crypto-wasm.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify encrypted retail NONE BASIC NORMAL preparation end to end
        run: node ./test-xex-retail-normal-end-to-end.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify prepared PE image maps from decoded metadata into guest memory
        run: node ./test-xex-pe-guest-loader.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify prepared PE entry handoff into Xenia PPC/HIR
        run: node ./test-xex-prepared-entry-handoff.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify one-call default.xex preparation to Xenia handoff
        run: node ./test-default-xex-title-controller.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify one-call STFS package to Xenia title handoff
        run: node ./test-stfs-package-title-controller.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify first runtime boundary telemetry
        run: node ./test-title-runtime-boundary.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify PPC to kernel HLE dispatch bridge
        run: node ./test-kernel-hle-bridge.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: "Harsh critic: verify minimum kernel ABI contract"
        run: node ./test-kernel-abi-critic.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: "Harsh critic: verify xboxkrnl and XAM starter services in main wasm"
        run: node ./test-kernel-services-critic.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: "Harsh critic: verify real imported thunks reach built-in kernel services"
        run: node ./test-kernel-import-service-bridge.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: "Harsh critic: verify guest threads TLS and runtime in main wasm"
        run: node ./test-guest-runtime-critic.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify Xenos PM4 register draw and EDRAM semantics in main wasm
        run: node ./test-xenos-semantic-foundation.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify title PM4 constants shaders resources and indirect buffers
        run: node ./test-xenos-title-state-foundation.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify guest memory to Xenos EDRAM frame bridge in main wasm
        run: node ./test-xenos-guest-memory-bridge.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify WebGPU WGSL and Xenos frame upload bridge
        run: node ./test-webgpu-wgsl-edram-foundation.mjs
      - name: "Harsh critic: verify bounded Xenos first-frame semantics in main wasm"
        run: node ./test-xenos-harsh-critic.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify translated PPC produces the first genuine guest frame
        run: node ./test-first-genuine-guest-frame.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: "Harsh critic: verify first guest-frame provenance"
        run: node ./test-first-frame-provenance-critic.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify automatic XEX import to kernel execution bridge
        run: node ./test-title-kernel-import-integration.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify sparse title RAM, far PPC paging, Xenos MMIO and captured ring submission
        run: node ./test-title-gpu-runtime.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
      - name: Verify locked foundations and V36 XEX bring-up
        run: |
          if [ -f build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm ]; then
            node ./test-xenia-ppc-translation-probe.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-guest-control-foundation.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-fpu-foundation.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-vmx-foundation.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-cfg.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-memory.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-calls.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-fpu.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-fpu-semantics.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-vmx.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-cache.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-wasm-backend-foundation.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-sparse-guest-memory.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-xex-guest-mapper.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-xex-real-mapper-integration.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
          else
            echo 'Runtime gate pending: strict link has not produced xenia_ppc_bootstrap.wasm yet.'
          fi
      - name: Show compile and link state
        if: always()
        run: |
          if [ -f build/xenia-ppc-bootstrap/report.tsv ]; then cat build/xenia-ppc-bootstrap/report.tsv; else echo 'No compile report generated.'; fi
          echo
          if [ -f build/xenia-ppc-bootstrap/link-report.txt ]; then cat build/xenia-ppc-bootstrap/link-report.txt; else echo 'No link report generated.'; fi
      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xenia-wasm32-bootstrap-report
          path: |
            render360_xenia_core.wasm
            build/xenia-ppc-bootstrap/report.tsv
            build/xenia-ppc-bootstrap/link-report.txt
            build/xenia-ppc-bootstrap/*.log
            build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
          if-no-files-found: warn
          retention-days: 14
