name: Xenia WASM32 Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'fetch-xenia.sh'
      - 'xenia_contract_check.py'
      - 'xenia_web_bootstrap_check.py'
      - 'xenia_translation_foundation_check.py'
      - 'test-package-xex-foundation.mjs'
      - 'test-guest-control-foundation.mjs'
      - 'render360_xenia_core.cpp'
      - 'render360_xenia_core_v32.cpp'
      - 'render360_xenia_core.wasm'
      - 'render360_xenia_core_embedded.js'
      - 'build-core.sh'
      - 'wasm-core-v32.js'
      - 'xenia_port/**'
      - 'prepare-xenia-*-overlay.py'
      - 'build-xenia-ppc-bootstrap.sh'
      - 'link-xenia-ppc-bootstrap.sh'
      - 'test-xenia-ppc-translation-probe.mjs'
      - 'src/xenia_web_shims/**'
      - 'src/xenia_web_bootstrap/**'
      - 'README.md'
      - 'XENIA_WEB_BOOTSTRAP.md'
      - '.github/workflows/xenia-wasm32-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xenia-wasm32-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Render360
        uses: actions/checkout@v4

      - name: Rebuild V32 package/XEX WASM core from source
        run: bash ./build-core.sh

      - name: Verify STFS/XEX package foundation
        run: node ./test-package-xex-foundation.mjs

      - name: Fetch upstream Xenia
        run: bash ./fetch-xenia.sh

      - name: Audit Xenia contracts and translation foundation
        run: |
          python3 ./xenia_contract_check.py
          python3 ./xenia_web_bootstrap_check.py
          python3 ./xenia_translation_foundation_check.py

      - name: Compile and link real Xenia PPC/HIR wasm32 bootstrap
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            emscripten/emsdk:latest \
            bash -lc 'apt-get update -qq && apt-get install -y -qq llvm-dev >/dev/null && bash ./build-xenia-ppc-bootstrap.sh && bash ./link-xenia-ppc-bootstrap.sh'

      - name: Verify real PPC bytes reach Xenia HIR
        run: |
          if [ -f build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm ]; then
            node ./test-xenia-ppc-translation-probe.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
            node ./test-guest-control-foundation.mjs build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
          else
            echo 'Runtime gate pending: strict link has not produced xenia_ppc_bootstrap.wasm yet.'
          fi

      - name: Show compile and link state
        if: always()
        run: |
          if [ -f build/xenia-ppc-bootstrap/report.tsv ]; then
            cat build/xenia-ppc-bootstrap/report.tsv
          else
            echo 'No compile report generated.'
          fi
          echo
          if [ -f build/xenia-ppc-bootstrap/link-report.txt ]; then
            cat build/xenia-ppc-bootstrap/link-report.txt
          else
            echo 'No link report generated.'
          fi

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xenia-wasm32-bootstrap-report
          path: |
            render360_xenia_core.wasm
            build/xenia-ppc-bootstrap/report.tsv
            build/xenia-ppc-bootstrap/link-report.txt
            build/xenia-ppc-bootstrap/*.log
            build/xenia-ppc-bootstrap/xenia_ppc_bootstrap.wasm
          if-no-files-found: warn
          retention-days: 14
