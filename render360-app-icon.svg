<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Render360">
  <defs>
    <linearGradient id="bg" x1="170" y1="110" x2="850" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171A18"/>
      <stop offset="0.48" stop-color="#080A09"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="green" x1="312" y1="238" x2="746" y2="792" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BFF8A"/>
      <stop offset="0.42" stop-color="#30D158"/>
      <stop offset="1" stop-color="#08A942"/>
    </linearGradient>
    <linearGradient id="metal" x1="340" y1="300" x2="690" y2="744" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#E8ECE9"/>
      <stop offset="1" stop-color="#9EA7A1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(512 472) rotate(90) scale(334)">
      <stop stop-color="#30D158" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#30D158" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Apple-like icon shell: simple, quiet, high-contrast. -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="208" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="4"/>
  <circle cx="512" cy="512" r="344" fill="url(#halo)"/>

  <!-- Render360 orbit. The broken ring suggests 360-degree emulation without copying a console logo. -->
  <path d="M298 365C347 282 438 228 539 228c151 0 273 122 273 273 0 121-79 224-188 260" fill="none" stroke="url(#green)" stroke-width="54" stroke-linecap="round"/>
  <circle cx="315" cy="696" r="27" fill="#30D158"/>

  <!-- Original Xenia/Xbox-inspired core: two soft ribbons forming a restrained X/R360 mark. -->
  <g filter="url(#shadow)">
    <path d="M353 347c0-20 23-31 39-19l120 92 120-92c16-12 39-1 39 19v54c0 15-7 30-19 39l-99 76 99 76c12 9 19 24 19 39v54c0 20-23 31-39 19L512 612l-120 92c-16 12-39 1-39-19v-54c0-15 7-30 19-39l99-76-99-76c-12-9-19-24-19-39v-54Z" fill="url(#metal)"/>
    <path d="M512 420 632 328c16-12 39-1 39 19v54c0 15-7 30-19 39l-99 76 99 76c12 9 19 24 19 39v54c0 20-23 31-39 19L512 612Z" fill="url(#green)"/>
  </g>

  <!-- Tiny center aperture gives the mark a machined, console-core feel at large sizes. -->
  <circle cx="512" cy="516" r="25" fill="#080A09"/>
  <circle cx="512" cy="516" r="10" fill="#30D158"/>
</svg>
