[package]
name = "render360-spirv-wgsl"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
naga = { version = "30.0.1", default-features = false, features = ["spv-in", "wgsl-out"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
